<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minik Sanatçı - Çocuk Boyama ve Aktivite Dünyası</title>
    <!-- Konfeti Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #fdfbf7; color: #333; text-align: center; padding: 10px; }
        
        /* Tüm Uygulama Çerçevesi (Tam Ekran Modunda Bu Kapsayıcı Büyür) */
        #appContainer { background: #fdfbf7; padding: 5px; width: 100%; max-width: 520px; margin: 0 auto; border-radius: 20px; transition: all 0.3s; }

        /* Tam Ekran Olunca Tüm Ekranı Kaplar ve Yatay (Landscape) Düzen Oluşur */
        #appContainer:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            background: #fdfbf7;
            padding: 15px;
            display: flex;
            flex-direction: row; /* Yan yana yerleşim */
            justify-content: center;
            align-items: center;
            gap: 20px;
            overflow: hidden;
        }
        #appContainer:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            background: #fdfbf7;
            padding: 15px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;
            overflow: hidden;
        }

        /* Başlık Alanı */
        header { background: #ffdf6d; padding: 12px; border-radius: 15px; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #ff5722; font-size: 20px; margin-bottom: 3px; }
        p { color: #555; font-size: 12px; }
        #appContainer:fullscreen header { display: none; } /* Tam ekranda ana başlığı gizleyip alanı koruyoruz */

        /* Sol Menü Paneli (Tam Ekran İçin) */
        .left-control-panel { display: flex; flex-direction: column; align-items: center; }
        #appContainer:fullscreen .left-control-panel { max-height: 95vh; overflow-y: auto; padding-right: 5px; }

        /* Bölüm Kutuları */
        .section { background: white; padding: 12px 8px; border-radius: 15px; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; }
        .section h2 { color: #333; font-size: 16px; margin-bottom: 6px; }

        /* Şablon Seçim Butonları */
        .template-group { display: flex; justify-content: center; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
        .tpl-btn { background: #ab47bc; color: white; border: none; padding: 5px 10px; font-size: 11px; font-weight: bold; border-radius: 12px; cursor: pointer; }
        .tpl-btn.active { background: #7b1fa2; transform: scale(1.05); }

        /* Renk Paleti ve Özel Renk */
        .palette { display: flex; justify-content: center; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
        .color-box { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .color-box.active { border: 3px solid #333; transform: scale(1.15); }
        .custom-color-picker { width: 30px; height: 30px; border: none; border-radius: 50%; cursor: pointer; padding: 0; background: none; }

        /* Araçlar ve Kalem Boyutları */
        .tools { margin: 6px 0; display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; }
        .tool-btn { background: #ff9800; color: white; border: none; padding: 6px 10px; font-size: 11px; font-weight: bold; border-radius: 15px; cursor: pointer; }
        .tool-btn.size-btn { background: #607d8b; }
        .tool-btn.size-btn.active-size { background: #263238; border: 2px solid #ffeb3b; }
        .tool-btn.eraser { background: #78909c; }
        .tool-btn.bucket { background: #00acc1; }
        .tool-btn.bucket.active-bucket { background: #006064; border: 2px solid #ffeb3b; }
        .tool-btn.undo-redo { background: #8e24aa; }
        .tool-btn.eyedropper { background: #00897b; }
        .tool-btn.eyedropper.active-eyedropper { background: #004d40; border: 2px solid #ffeb3b; }
        .tool-btn.stamp { background: #d81b60; }
        .tool-btn.fullscreen { background: #3f51b5; }
        .tool-btn.clear { background: #e53935; }

        /* Tuval Alanı ve Tam Ekran Boyutlandırma */
        .canvas-container { position: relative; display: inline-block; width: 100%; }
        canvas { background: #fff; border: 3px dashed #ffb74d; border-radius: 15px; width: 100%; max-width: 460px; height: 310px; touch-action: none; cursor: crosshair; display: block; margin: 0 auto; }
        
        #appContainer:fullscreen canvas { max-width: none; width: 62vw; height: 85vh; border: 3px solid #ffb74d; }

        /* Çocuk İsmi Girişi */
        input[type="text"] { padding: 8px; font-size: 15px; border: 3px solid #ffcc80; border-radius: 15px; width: 95%; max-width: 440px; margin: 8px 0 6px 0; text-align: center; font-weight: bold; color: #ff5722; background: #fffdf9; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        /* Genel Butonlar */
        .btn { background: #2196f3; color: white; border: none; padding: 10px 16px; font-size: 14px; font-weight: bold; border-radius: 25px; cursor: pointer; text-decoration: none; display: inline-block; box-shadow: 0 4px 10px rgba(33,150,243,0.3); transition: 0.2s; margin: 5px 4px; width: 90%; max-width: 300px; text-align: center; }
        .btn:hover { transform: scale(1.02); }
        .btn.boyama1 { background: #4caf50; }
        .btn.boyama2 { background: #ff9800; }
        .btn.indir { background: #e91e63; }

        .library-section { background: white; padding: 12px; border-radius: 15px; margin-top: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        #appContainer:fullscreen .library-section { display: none; } /* Tam ekranda PDF indirme alanı gizlenir, odağı boyamaya verir */
    </style>
</head>
<body>

    <!-- TÜM UYGULAMA KAPSAYICISI (Tam Ekran Buraya Tetiklenir) -->
    <div id="appContainer">

        <!-- Sol veya Üst Kontrol Paneli -->
        <div class="left-control-panel">
            <header>
                <h1>🎨 Minik Sanatçı Boyama Dünyası</h1>
                <p>Dijital Tuval ve Boyama Kitapları!</p>
            </header>

            <div class="section">
                <h2>✨ Akıllı Boyama Tuvali</h2>
                
                <!-- Şablon Seçimi -->
                <div class="template-group">
                    <button class="tpl-btn active" onclick="setTemplate('house', this)">🏠 Ev & Bahçe</button>
                    <button class="tpl-btn" onclick="setTemplate('cat', this)">🐱 Sevimli Kedi</button>
                    <button class="tpl-btn" onclick="setTemplate('rocket', this)">🚀 Uzay Roketi</button>
                </div>

                <!-- Renk Paleti ve Özel Renk Seçici -->
                <div class="palette">
                    <div class="color-box active" style="background: #ff5722;" onclick="selectColor('#ff5722', this)"></div>
                    <div class="color-box" style="background: #4caf50;" onclick="selectColor('#4caf50', this)"></div>
                    <div class="color-box" style="background: #2196f3;" onclick="selectColor('#2196f3', this)"></div>
                    <div class="color-box" style="background: #ffeb3b;" onclick="selectColor('#ffeb3b', this)"></div>
                    <div class="color-box" style="background: #9c27b0;" onclick="selectColor('#9c27b0', this)"></div>
                    <div class="color-box" style="background: #e91e63;" onclick="selectColor('#e91e63', this)"></div>
                    <input type="color" class="custom-color-picker" title="Özel Renk Seç" value="#ff5722" onchange="selectColor(this.value, null)">
                </div>

                <!-- Gelişmiş Araçlar ve Kalem Kalınlıkları -->
                <div class="tools">
                    <button class="tool-btn size-btn active-size" id="sizeThin" onclick="setLineWidth(3, this)">✏️ İnce</button>
                    <button class="tool-btn size-btn" id="sizeNormal" onclick="setLineWidth(8, this)">🖊️ Normal</button>
                    <button class="tool-btn size-btn" id="sizeThick" onclick="setLineWidth(16, this)">🖌 Kalın</button>
                    <button class="tool-btn undo-redo" onclick="undoAction()">↩️ Geri Al</button>
                    <button class="tool-btn undo-redo" onclick="redoAction()">🔁 İleri</button>
                </div>
                <div class="tools">
                    <button class="tool-btn bucket" id="bucketBtn" onclick="enableBucket()">🪣 Dolgu</button>
                    <button class="tool-btn eyedropper" id="eyedropperBtn" onclick="enableEyedropper()">💧 Damlalık</button>
                    <button class="tool-btn stamp" onclick="enableStamp('⭐')">⭐ Yıldız</button>
                    <button class="tool-btn stamp" onclick="enableStamp('❤️')">❤️ Kalp</button>
                    <button class="tool-btn eraser" onclick="enableEraser(this)">🧽 Silgi</button>
                </div>
                <div class="tools">
                    <button class="tool-btn fullscreen" onclick="toggleFullScreen()">⛶ Tam Ekran / Yatay</button>
                    <button class="tool-btn clear" onclick="clearCanvas()">🗑️ Temizle</button>
                </div>

                <!-- Büyük İsim Girişi -->
                <input type="text" id="childName" placeholder="Adını Buraya Yaz (Harfleri Boya!)" oninput="redrawEverything()">
            </div>

            <!-- Yazıcı İçin Boyama Kitapları Bölümü -->
            <div class="library-section">
                <h2>📚 Yazıcı İçin Boyama Kitapları</h2>
                <div class="tools" style="margin-top: 8px;">
                    <a href="boyama-kitap-01.pdf" class="btn boyama1" target="_blank" style="width: 48%; font-size: 12px; padding: 8px;">🖍️ Kitap 1 (PDF)</a>
                    <a href="boyama-kitap-02.pdf" class="btn boyama2" target="_blank" style="width: 48%; font-size: 12px; padding: 8px;">🖍️ Kitap 2 (PDF)</a>
                </div>
            </div>
        </div>

        <!-- Sağ Taraf: Tuval ve İndir Butonu Alanı -->
        <div class="right-canvas-panel">
            <div class="canvas-container" id="canvasContainer">
                <canvas id="paintCanvas" width="460" height="310"></canvas>
            </div>
            <br>
            <button class="btn indir" onclick="downloadImage()">📸 Boyadığımı İndir & Kutla 🎉</button>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;
        let currentColor = '#ff5722';
        let currentLineWidth = 3; 
        let currentTemplate = 'house';
        let activeTool = 'brush'; 
        let currentStampChar = '⭐';

        let historySteps = [];
        let historyStepIndex = -1;

        let userCanvas = document.createElement('canvas');
        userCanvas.width = 460;
        userCanvas.height = 310;
        let userCtx = userCanvas.getContext('2d');

        function playPopSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        function resetUserCanvas() {
            userCtx.fillStyle = '#fff';
            userCtx.fillRect(0, 0, userCanvas.width, userCanvas.height);
        }
        resetUserCanvas();

        function saveState() {
            historySteps = historySteps.slice(0, historyStepIndex + 1);
            historySteps.push(userCtx.getImageData(0, 0, userCanvas.width, userCanvas.height));
            historyStepIndex++;
            if (historySteps.length > 20) {
                historySteps.shift();
                historyStepIndex--;
            }
        }

        function undoAction() {
            if (historyStepIndex > 0) {
                historyStepIndex--;
                userCtx.putImageData(historySteps[historyStepIndex], 0, 0);
                redrawEverything();
                playPopSound();
            }
        }

        function redoAction() {
            if (historyStepIndex < historySteps.length - 1) {
                historyStepIndex++;
                userCtx.putImageData(historySteps[historyStepIndex], 0, 0);
                redrawEverything();
                playPopSound();
            }
        }

        function drawTemplateLines() {
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#333';

            if (currentTemplate === 'house') {
                ctx.beginPath(); ctx.arc(75, 45, 20, 0, Math.PI * 2); ctx.fillStyle = '#fff9c4'; ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(355, 50, 13, 0, Math.PI * 2); ctx.arc(375, 50, 17, 0, Math.PI * 2); ctx.arc(395, 50, 13, 0, Math.PI * 2); ctx.stroke();
                ctx.strokeRect(150, 110, 160, 110);
                ctx.beginPath(); ctx.moveTo(125, 110); ctx.lineTo(230, 45); ctx.lineTo(335, 110); ctx.closePath(); ctx.stroke();
                ctx.strokeRect(205, 160, 50, 60);
                ctx.strokeRect(170, 130, 30, 30);
                ctx.strokeRect(260, 130, 30, 30);
            } else if (currentTemplate === 'cat') {
                ctx.beginPath(); ctx.arc(230, 140, 65, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(180, 95); ctx.lineTo(170, 45); ctx.lineTo(215, 85); ctx.closePath(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(280, 95); ctx.lineTo(290, 45); ctx.lineTo(245, 85); ctx.closePath(); ctx.stroke();
                ctx.beginPath(); ctx.arc(205, 125, 7, 0, Math.PI * 2); ctx.fillStyle = '#333'; ctx.fill();
                ctx.beginPath(); ctx.arc(255, 125, 7, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(230, 145, 4, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.moveTo(170, 150); ctx.lineTo(130, 142); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(170, 162); ctx.lineTo(130, 165); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(290, 150); ctx.lineTo(330, 142); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(290, 162); ctx.lineTo(330, 165); ctx.stroke();
            } else if (currentTemplate === 'rocket') {
                ctx.beginPath(); ctx.arc(230, 105, 35, Math.PI, 0, false); ctx.lineTo(265, 180); ctx.lineTo(195, 180); ctx.closePath(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(195, 145); ctx.lineTo(165, 180); ctx.lineTo(195, 180); ctx.closePath(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(265, 145); ctx.lineTo(295, 180); ctx.lineTo(265, 180); ctx.closePath(); ctx.stroke();
                ctx.beginPath(); ctx.arc(230, 100, 12, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(215, 180); ctx.lineTo(230, 215); ctx.lineTo(245, 180); ctx.closePath(); ctx.stroke();
            }

            const nameInput = document.getElementById('childName').value.trim().toUpperCase();
            const displayName = nameInput !== "" ? nameInput : "SANATÇI";
            
            ctx.font = "bold 26px Arial";
            ctx.textAlign = "center";
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = "#333";
            ctx.fillStyle = "rgba(0,0,0,0)";
            ctx.strokeText(displayName, canvas.width / 2, 275);
        }

        function redrawEverything() {
            ctx.drawImage(userCanvas, 0, 0);
            drawTemplateLines();
        }

        function initCanvas() {
            resetUserCanvas();
            userCtx.lineWidth = 3;
            userCtx.strokeStyle = '#ccc';
            userCtx.strokeRect(10, 10, userCanvas.width - 20, userCanvas.height - 20);
            
            historySteps = [];
            historyStepIndex = -1;
            saveState();

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            redrawEverything();
        }
        initCanvas();

        function setTemplate(tpl, btn) {
            currentTemplate = tpl;
            setActiveTool('brush');
            document.querySelectorAll('.tpl-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            initCanvas();
            playPopSound();
        }

        function setLineWidth(width, btn) {
            currentLineWidth = width;
            if(activeTool === 'eraser') setActiveTool('brush');
            else if(activeTool !== 'brush') setActiveTool('brush');
            
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active-size'));
            if(btn) btn.classList.add('active-size');
            playPopSound();
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX, clientY = e.clientY;
            if (e.touches && e.touches[0]) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            let scaleX = canvas.width / rect.width;
            let scaleY = canvas.height / rect.height;
            return { 
                x: (clientX - rect.left) * scaleX, 
                y: (clientY - rect.top) * scaleY 
            };
        }

        function floodFill(startX, startY, fillColorHex) {
            redrawEverything();
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imgData.data;

            const startPos = (Math.floor(startY) * canvas.width + Math.floor(startX)) * 4;
            const startR = pixels[startPos];
            const startG = pixels[startPos + 1];
            const startB = pixels[startPos + 2];

            if (startR < 50 && startG < 50 && startB < 50) return;

            let tempC = document.createElement('canvas').getContext('2d');
            tempC.fillStyle = fillColorHex;
            tempC.fillRect(0,0,1,1);
            let cData = tempC.getImageData(0,0,1,1).data;
            const targetR = cData[0], targetG = cData[1], targetB = cData[2];

            if (startR === targetR && startG === targetG && startB === targetB) return;

            const userImgData = userCtx.getImageData(0, 0, userCanvas.width, userCanvas.height);
            const userPixels = userImgData.data;

            let queue = [[Math.floor(startX), Math.floor(startY)]];
            let visited = new Uint8Array(canvas.width * canvas.height);

            while (queue.length > 0) {
                let [x, y] = queue.pop();
                let idx = (y * canvas.width + x);

                if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) continue;
                if (visited[idx]) continue;
                visited[idx] = 1;

                let pIdx = idx * 4;
                let r = pixels[pIdx], g = pixels[pIdx+1], b = pixels[pIdx+2];

                if (r < 60 && g < 60 && b < 60) continue;

                if (Math.abs(r - startR) + Math.abs(g - startG) + Math.abs(b - startB) < 60) {
                    userPixels[pIdx] = targetR;
                    userPixels[pIdx+1] = targetG;
                    userPixels[pIdx+2] = targetB;
                    userPixels[pIdx+3] = 255;

                    pixels[pIdx] = targetR;
                    pixels[pIdx+1] = targetG;
                    pixels[pIdx+2] = targetB;

                    queue.push([x + 1, y]);
                    queue.push([x - 1, y]);
                    queue.push([x, y + 1], [x, y - 1]);
                }
            }

            userCtx.putImageData(userImgData, 0, 0);
            redrawEverything();
            saveState();
        }

        function pickColor(x, y) {
            redrawEverything();
            const pixel = ctx.getImageData(x, y, 1, 1).data;
            if (pixel[0] < 50 && pixel[1] < 50 && pixel[2] < 50) return;
            
            const hex = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1);
            currentColor = hex;
            setActiveTool('brush');
            playPopSound();
        }

        function placeStamp(x, y, char) {
            userCtx.font = "28px Arial";
            userCtx.textAlign = "center";
            userCtx.textBaseline = "middle";
            userCtx.fillText(char, x, y);
            redrawEverything();
            saveState();
            playPopSound();
        }

        function startAction(e) {
            const pos = getMousePos(e);
            
            if (activeTool === 'bucket') {
                floodFill(pos.x, pos.y, currentColor);
                playPopSound();
                return;
            } else if (activeTool === 'eyedropper') {
                pickColor(pos.x, pos.y);
                return;
            } else if (activeTool === 'stamp') {
                placeStamp(pos.x, pos.y, currentStampChar);
                return;
            }

            painting = true;
            userCtx.beginPath();
            userCtx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function endPosition() {
            if (!painting) return;
            painting = false;
            userCtx.beginPath();
            saveState();
        }

        function draw(e) {
            if (!painting || activeTool === 'bucket' || activeTool === 'eyedropper' || activeTool === 'stamp') return;
            e.preventDefault();
            const pos = getMousePos(e);

            userCtx.lineWidth = currentLineWidth;
            userCtx.lineCap = 'round';
            userCtx.lineJoin = 'round';
            userCtx.strokeStyle = currentColor;

            userCtx.lineTo(pos.x, pos.y);
            userCtx.stroke();
            userCtx.beginPath();
            userCtx.moveTo(pos.x, pos.y);

            redrawEverything();
        }

        canvas.addEventListener('mousedown', startAction);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', startAction, { passive: false });
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw, { passive: false });

        function selectColor(color, element) {
            currentColor = color;
            if (activeTool !== 'brush' && activeTool !== 'eraser') setActiveTool('brush');
            document.querySelectorAll('.color-box').forEach(b => b.classList.remove('active'));
            if(element) element.classList.add('active');
            playPopSound();
        }

        function setActiveTool(tool) {
            activeTool = tool;
            document.getElementById('bucketBtn').classList.remove('active-bucket');
            document.getElementById('eyedropperBtn').classList.remove('active-eyedropper');
            
            if (tool === 'bucket') document.getElementById('bucketBtn').classList.add('active-bucket');
            if (tool === 'eyedropper') document.getElementById('eyedropperBtn').classList.add('active-eyedropper');
        }

        function enableEraser(element) {
            currentColor = '#ffffff';
            currentLineWidth = 20;
            setActiveTool('brush');
            playPopSound();
        }

        function enableBucket() {
            setActiveTool('bucket');
            playPopSound();
        }

        function enableEyedropper() {
            setActiveTool('eyedropper');
            playPopSound();
        }

        function enableStamp(char) {
            activeTool = 'stamp';
            currentStampChar = char;
            playPopSound();
        }

        function toggleFullScreen() {
            const container = document.getElementById('appContainer');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
            playPopSound();
        }

        function clearCanvas() {
            setActiveTool('brush');
            initCanvas();
            playPopSound();
        }

        function downloadImage() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });

            redrawEverything();
            const link = document.createElement('a');
            link.download = 'minik-sanatci-boyama.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
