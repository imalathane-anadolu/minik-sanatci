<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minik Sanatçı - Çocuk Boyama ve Çizim İstasyonu</title>
    <!-- Canvas Confetti Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #4ecdc4;
            --accent-color: #ffe66d;
            --bg-color: #f7f9fc;
            --text-color: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Bubblegum Sans', 'Arial Rounded MT Bold', sans-serif, cursive;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 10px;
        }

        /* Ekran Yönetimi */
        .screen {
            display: none;
            width: 100%;
            max-width: 800px;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.4s ease-in-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 1. GİRİŞ EKRANI (İLK SAYFA) --- */
        #home-screen {
            justify-content: center;
            align-items: center;
            height: 90vh;
            text-align: center;
        }

        .home-title {
            font-size: 2.8rem;
            color: #ff4757;
            text-shadow: 3px 3px 0px #ffeaa7;
            margin-bottom: 40px;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
            padding: 0 20px;
        }

        .menu-btn {
            background-color: #fff;
            border: 4px solid #ff4757;
            border-radius: 25px;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #2f3542;
            cursor: pointer;
            box-shadow: 0 8px 0 #ff4757;
            transition: all 0.1s ease;
        }

        .menu-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #ff4757;
        }

        .menu-btn:nth-child(1) { border-color: #ff6b6b; box-shadow: 0 8px 0 #ff6b6b; }
        .menu-btn:nth-child(1):active { box-shadow: 0 2px 0 #ff6b6b; }
        
        .menu-btn:nth-child(2) { border-color: #2ed573; box-shadow: 0 8px 0 #2ed573; color: #2ed573; }
        .menu-btn:nth-child(2):active { box-shadow: 0 2px 0 #2ed573; }

        .menu-btn:nth-child(3) { border-color: #1e90ff; box-shadow: 0 8px 0 #1e90ff; color: #1e90ff; }
        .menu-btn:nth-child(3):active { box-shadow: 0 2px 0 #1e90ff; }

        /* --- 2. BOYAMA KİTAPLARI EKRANI (ŞABLON SEÇİMİ) --- */
        .header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            background-color: #ffa502;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.1rem;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 0 #e67e22;
            font-weight: bold;
        }

        .back-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .section-title {
            font-size: 1.8rem;
            color: #2f3542;
            margin-bottom: 15px;
        }

        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            width: 100%;
            max-height: 75vh;
            overflow-y: auto;
            padding: 10px;
        }

        .template-card {
            background: white;
            border: 3px solid #ced6e0;
            border-radius: 15px;
            padding: 10px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .template-card:hover {
            transform: scale(1.05);
            border-color: #ff4757;
        }

        .template-card canvas {
            width: 100%;
            height: 100px;
            background: #fff;
            border-radius: 10px;
        }

        .template-card span {
            display: block;
            margin-top: 5px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #57606f;
        }

        /* --- 3. ÇİZİM / BOYAMA UYGULAMA EKRANI --- */
        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #ffffff;
            border: 4px solid #dfe4ea;
            border-radius: 15px;
            overflow: hidden;
            touch-action: none;
            cursor: crosshair;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Araç Çubukları */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }

        .tool-btn {
            background: #f1f2f6;
            border: 2px solid #ced6e0;
            border-radius: 12px;
            padding: 8px 15px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-btn.active {
            background: #ff4757;
            color: white;
            border-color: #ff6b81;
        }

        /* Renk Paleti */
        .palette {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
            max-width: 100%;
        }

        .color-swatch {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .color-swatch:hover {
            transform: scale(1.15);
        }

        .color-swatch.active {
            transform: scale(1.25);
            border-color: #2f3542;
        }

        /* Eylem Butonları (Kaydet, Tam Ekran vb.) */
        .action-bar {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
            justify-content: center;
        }

        .action-btn {
            background: #2ed573;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #26af5f;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .action-btn.clear {
            background: #ff4757;
            box-shadow: 0 4px 0 #ff3838;
        }

        .action-btn.fullscreen {
            background: #3742fa;
            box-shadow: 0 4px 0 #2f3542;
        }
    </style>
</head>
<body>

    <!-- 1. GİRİŞ EKRANI (İLK SAYFA) -->
    <div id="home-screen" class="screen active">
        <h1 class="home-title">🎨 Minik Sanatçı 🖌️</h1>
        <div class="menu-container">
            <button class="menu-btn" onclick="openScreen('books-screen')">📚 Boyama Kitapları</button>
            <button class="menu-btn" onclick="startDrawingApp(null)">✏️ Kendin Çiz</button>
            <button class="menu-btn" onclick="openSizdenGelenler()">🌟 Sizden Gelenler</button>
        </div>
    </div>

    <!-- 2. BOYAMA KİTAPLARI EKRANI (50 ŞABLON) -->
    <div id="books-screen" class="screen">
        <div class="header-bar">
            <button class="back-btn" onclick="openScreen('home-screen')">⬅️ Ana Sayfa</button>
            <h2 class="section-title" style="margin:0;">Boyama Kitabı Seç</h2>
            <div style="width: 80px;"></div>
        </div>
        <div class="templates-grid" id="templates-grid">
            <!-- 50 Adet Şablon JavaScript ile Dinamik Eklenecek -->
        </div>
    </div>

    <!-- 3. ÇİZİM / BOYAMA UYGULAMA EKRANI -->
    <div id="app-screen" class="screen">
        <div class="header-bar">
            <button class="back-btn" onclick="openScreen('home-screen')">⬅️ Ana Sayfa</button>
            <h2 class="section-title" id="canvas-title" style="margin:0;">Çizim Alanı</h2>
            <div style="width: 80px;"></div>
        </div>

        <div class="app-container">
            <div class="canvas-wrapper" id="canvas-wrapper">
                <canvas id="paintCanvas"></canvas>
            </div>

            <!-- Araç Çubuğu -->
            <div class="toolbar">
                <button class="tool-btn active" id="tool-brush" onclick="setTool('brush')">✏️ Fırça</button>
                <button class="tool-btn" id="tool-fill" onclick="setTool('fill')">🪣 Boya Kovası</button>
                <button class="tool-btn" id="tool-stamp" onclick="setTool('stamp')">⭐ Damga</button>
                <button class="tool-btn" id="tool-eraser" onclick="setTool('eraser')">🧹 Silgi</button>
                <select id="brush-size" class="tool-btn" onchange="changeSize(this.value)">
                    <option value="5">İnce</option>
                    <option value="12" selected>Orta</option>
                    <option value="25">Kalın</option>
                </select>
            </div>

            <!-- Renk Paleti -->
            <div class="palette" id="color-palette">
                <!-- Renkler JS ile yüklenecek -->
            </div>

            <!-- Eylem Butonları -->
            <div class="action-bar">
                <button class="action-btn clear" onclick="clearCanvas()">🗑️ Temizle</button>
                <button class="action-btn fullscreen" onclick="toggleFullScreen()">📺 Tam Ekran</button>
                <button class="action-btn" onclick="saveImage()">💾 Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        // --- GENEL EKRAN GEÇİŞLERİ ---
        function openScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(screenId === 'books-screen') {
                renderTemplates();
            }
        }

        // --- SİZDEN GELENLER (MAİL YÖNLENDİRME) ---
        function openSizdenGelenler() {
            const email = "anadoluimalathane@gmail.com";
            const subject = encodeURIComponent("Sizden Gelenler - Resmim");
            const body = encodeURIComponent("Merhaba,\n\nÇocuğumun yaptığı resmi ekte gönderiyorum. Sizden Gelenler köşenizde paylaşmanız dileğiyle!\n\nSevgiler.");
            window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
        }

        // --- 50 ADET BOYAMA ŞABLONU OLUŞTURUCU ---
        const templateCategories = ["Ev", "Kedi", "Köpek", "Araba", "Roket", "Kelebek", "Balık", "Ayı", "Çiçek", "Gemi", "Uçak", "Ağaç", "Aslan", "Fil", "Zürafa", "Robot", "Kardan Adam", "Dinozor", "Güneş", "Bulut", "Yıldız", "Kalp", "Bisiklet", "Tren", "Mantar", "Kuzu", "Kurbağa", "Ördek", "Maymun", "Penguen", "Kuş", "Kuğu", "Yunus", "Kaplumbağa", "Kaktüs", "Şato", "Korsan Gemisi", "Helikopter", "Traktör", "İtfaiye", "Polis Arabası", "Roket", "Pasta", "Dondurma", "Şeker", "Hediye", "Taç", "Kale", "Balon", "Uçurtma"];

        function renderTemplates() {
            const grid = document.getElementById('templates-grid');
            if (grid.children.length > 0) return; // Zaten yüklendiyse tekrar yükleme

            templateCategories.forEach((name, index) => {
                const card = document.createElement('div');
                card.className = 'template-card';
                card.onclick = () => startDrawingApp(index);

                const thumbCanvas = document.createElement('canvas');
                thumbCanvas.width = 150;
                thumbCanvas.height = 100;
                drawTemplateThumbnail(thumbCanvas, index);

                const label = document.createElement('span');
                label.innerText = `${index + 1}. ${name}`;

                card.appendChild(thumbCanvas);
                card.appendChild(label);
                grid.appendChild(card);
            });
        }

        function drawTemplateThumbnail(canvas, index) {
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#2d3436";
            ctx.lineWidth = 3;
            ctx.fillStyle = "#dfe4ea";

            ctx.save();
            ctx.scale(0.5, 0.5);
            ctx.translate(75, 50);
            
            // Basit çizim simülasyonları
            ctx.beginPath();
            ctx.arc(0, 0, 40, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fill();

            ctx.restore();
        }

        // --- ÇİZİM VE BOYAMA MOTORU ---
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let currentTool = 'brush';
        let currentColor = '#ff4757';
        let currentSize = 12;
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        const colors = [
            '#000000', '#ffffff', '#ff4757', '#ff6b81', '#ffa502', '#fffa65', 
            '#2ed573', '#7bed9f', '#1e90ff', '#70a1ff', '#9b59b6', '#8e44ad', 
            '#e84393', '#fd79a8', '#d63031', '#00b894', '#0984e3', '#6c5ce7'
        ];

        function initPalette() {
            const paletteEl = document.getElementById('color-palette');
            paletteEl.innerHTML = '';
            colors.forEach((col, idx) => {
                const swatch = document.createElement('div');
                swatch.className = `color-swatch ${idx === 2 ? 'active' : ''}`;
                swatch.style.backgroundColor = col;
                swatch.onclick = () => {
                    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');
                    currentColor = col;
                    if(currentTool === 'eraser') setTool('brush');
                };
                paletteEl.appendChild(swatch);
            });
        }

        function startDrawingApp(templateIndex) {
            openScreen('app-screen');
            resizeCanvas();
            clearCanvas();
            
            if(templateIndex !== null) {
                document.getElementById('canvas-title').innerText = `Boyama: ${templateCategories[templateIndex]}`;
                drawTemplateOnMainCanvas(templateIndex);
            } else {
                document.getElementById('canvas-title').innerText = "Kendin Çiz";
            }
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
        }

        function drawTemplateOnMainCanvas(index) {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Şablon Çizgileri
            ctx.strokeStyle = "#2d3436";
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            
            // Örnek şablon şekli çizimi
            ctx.beginPath();
            ctx.arc(0, 0, Math.min(canvas.width, canvas.height) * 0.3, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => {
                if(!btn.tagName || btn.tagName !== 'SELECT') btn.classList.remove('active');
            });
            if(tool !== 'eraser') {
                const activeBtn = document.getElementById(`tool-${tool}`);
                if(activeBtn) activeBtn.classList.add('active');
            }
        }

        function changeSize(val) {
            currentSize = parseInt(val);
        }

        function clearCanvas() {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Fare ve Dokunmatik Olayları
        canvas.addEventListener('pointerdown', startDraw);
        canvas.addEventListener('pointermove', draw);
        canvas.addEventListener('pointerup', stopDraw);
        canvas.addEventListener('pointercancel', stopDraw);

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function startDraw(e) {
            const pos = getMousePos(e);
            lastX = pos.x;
            lastY = pos.y;

            if (currentTool === 'fill') {
                floodFill(Math.floor(lastX), Math.floor(lastY), currentColor);
                return;
            }

            if (currentTool === 'stamp') {
                drawStamp(lastX, lastY);
                return;
            }

            isDrawing = true;
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getMousePos(e);

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);

            if (currentTool === 'eraser') {
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = currentSize * 2;
            } else {
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = currentSize;
            }

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDraw() {
            isDrawing = false;
        }

        function drawStamp(x, y) {
            ctx.font = `${currentSize * 3}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const stamps = ['⭐', '❤️', '🌟', '🎨', '🚀'];
            const randomStamp = stamps[Math.floor(Math.random() * stamps.length)];
            ctx.fillText(randomStamp, x, y);
        }

        // Boya Kovası Algoritması (Flood Fill)
        function floodFill(startX, startY, fillColor) {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const targetColor = getPixelColor(data, startX, startY, canvas.width);
            
            const rgbFill = hexToRgb(fillColor);
            if (colorsMatch(targetColor, rgbFill)) return;

            const queue = [[startX, startY]];
            const visited = new Uint8Array(canvas.width * canvas.height);

            while (queue.length > 0) {
                const [x, y] = queue.pop();
                if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) continue;
                
                const idx = (y * canvas.width + x);
                if (visited[idx]) continue;
                visited[idx] = 1;

                const pixelIdx = idx * 4;
                const currentPxColor = [data[pixelIdx], data[pixelIdx+1], data[pixelIdx+2]];

                if (colorsMatch(currentPxColor, targetColor)) {
                    data[pixelIdx] = rgbFill[0];
                    data[pixelIdx+1] = rgbFill[1];
                    data[pixelIdx+2] = rgbFill[2];

                    queue.push([x + 1, y]);
                    queue.push([x - 1, y]);
                    queue.push([x, y + 1]);
                    queue.push([x, y - 1]);
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        function getPixelColor(data, x, y, width) {
            const idx = (y * width + x) * 4;
            return [data[idx], data[idx+1], data[idx+2]];
        }

        function colorsMatch(c1, c2) {
            return Math.abs(c1[0] - c2[0]) < 15 && 
                   Math.abs(c1[1] - c2[1]) < 15 && 
                   Math.abs(c1[2] - c2[2]) < 15;
        }

        function hexToRgb(hex) {
            const bigint = parseInt(hex.replace('#',''), 16);
            return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
        }

        // Kaydet ve Kutlama Efekti
        function saveImage() {
            const link = document.createElement('a');
            link.download = 'minik-sanatci-eserim.png';
            link.href = canvas.toDataURL();
            link.click();

            // Kutlama Konfeti Efekti
            confetti({
                particleCount: 120,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Başlangıç Ayarı
        window.onload = () => {
            initPalette();
        };
    </script>
</body>
</html>
