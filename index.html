<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minik Sanatçı - Çocuk Boyama ve Aktivite Dünyası</title>
    <!-- Konfeti Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #fdfbf7; color: #333; text-align: center; padding: 10px; }
        
        /* Başlık Alanı */
        header { background: #ffdf6d; padding: 15px; border-radius: 20px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #ff5722; font-size: 22px; margin-bottom: 5px; }
        p { color: #555; font-size: 13px; }

        /* Bölüm Kutuları */
        .section { background: white; padding: 15px 10px; border-radius: 20px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .section h2 { color: #333; font-size: 18px; margin-bottom: 8px; }

        /* Şablon Seçim Butonları */
        .template-group { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        .tpl-btn { background: #ab47bc; color: white; border: none; padding: 6px 12px; font-size: 12px; font-weight: bold; border-radius: 15px; cursor: pointer; }
        .tpl-btn.active { background: #7b1fa2; transform: scale(1.05); }

        /* Renk Paleti ve Özel Renk */
        .palette { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .color-box { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .color-box.active { border: 3px solid #333; transform: scale(1.15); }
        .custom-color-picker { width: 35px; height: 35px; border: none; border-radius: 50%; cursor: pointer; padding: 0; background: none; }

        /* Araçlar ve Kalem Boyutları */
        .tools { margin: 8px 0; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
        .tool-btn { background: #ff9800; color: white; border: none; padding: 7px 12px; font-size: 12px; font-weight: bold; border-radius: 20px; cursor: pointer; }
        .tool-btn.size-btn { background: #607d8b; }
        .tool-btn.size-btn.active-size { background: #263238; border: 2px solid #ffeb3b; }
        .tool-btn.eraser { background: #78909c; }
        .tool-btn.bucket { background: #00acc1; }
        .tool-btn.bucket.active-bucket { background: #006064; border: 2px solid #ffeb3b; }
        .tool-btn.undo-redo { background: #8e24aa; }
        .tool-btn.eyedropper { background: #00897b; }
        .tool-btn.eyedropper.active-eyedropper { background: #004d40; border: 2px solid #ffeb3b; }
        .tool-btn.stamp { background: #d81b60; }
        .tool-btn.stamp.active-stamp { background: #880e4f; border: 2px solid #ffeb3b; }
        .tool-btn.fullscreen { background: #3f51b5; }
        .tool-btn.clear { background: #e53935; }

        /* Tuval Alanı ve Tam Ekran Düzeni */
        .canvas-container { position: relative; display: inline-block; width: 100%; max-width: 480px; }
        canvas { background: #fff; border: 3px dashed #ffb74d; border-radius: 15px; width: 100%; max-width: 480px; height: 340px; touch-action: none; cursor: crosshair; display: block; margin: 0 auto; }
        
        /* Tam Ekran Modu CSS Sınıfı */
        .canvas-container:fullscreen { width: 100vw; height: 100vh; background: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; }
        .canvas-container:fullscreen canvas { max-width: 90vw; height: 75vh; border: none; box-shadow: 0 0 20px rgba(0,0,0,0.2); }

        /* Büyük İsim Girişi */
        input[type="text"] { padding: 12px; font-size: 18px; border: 3px solid #ffcc80; border-radius: 20px; width: 95%; max-width: 450px; margin: 12px 0 8px 0; text-align: center; font-weight: bold; color: #ff5722; background: #fffdf9; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        /* Genel Butonlar */
        .btn { background: #2196f3; color: white; border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 30px; cursor: pointer; text-decoration: none; display: inline-block; box-shadow: 0 4px 10px rgba(33,150,243,0.3); transition: 0.2s; margin: 6px 4px; width: 90%; max-width: 320px; text-align: center; }
        .btn:hover { transform: scale(1.02); }
        .btn.boyama1 { background: #4caf50; }
        .btn.boyama2 { background: #ff9800; }
        .btn.indir { background: #e91e63; }

        .library-group { display: flex; flex-direction: column; gap: 8px; align-items: center; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- ÜST BİLGİ -->
    <header>
        <h1>🎨 Minik Sanatçı Boyama Dünyası</h1>
        <p>Dijital Tuval ve Boyama Kitapları!</p>
    </header>

    <!-- DİJİTAL BOYAMA TUVALİ -->
    <div class="section">
        <h2>✨ Akıllı Boyama Tuvali</h2>
        
        <!-- Şablon Seçimi -->
        <div class="template-group">
            <button class="tpl-btn active" onclick="setTemplate('house', this)">🏠 Ev & Bahçe</button>
            <button class="tpl-btn" onclick="setTemplate('cat', this)">🐱 Sevimli Kedi</button>
            <button class="tpl-btn" onclick="setTemplate('rocket', this)">🚀 Uzay Roketi</button>
        </div>

        <!-- Renk Paleti ve Özel Renk Seçici -->
        <div class="palette">
            <div class="color-box active" style="background: #ff5722;" onclick="selectColor('#ff5722', this)"></div>
            <div class="color-box" style="background: #4caf50;" onclick="selectColor('#4caf50', this)"></div>
            <div class="color-box" style="background: #2196f3;" onclick="selectColor('#2196f3', this)"></div>
            <div class="color-box" style="background: #ffeb3b;" onclick="selectColor('#ffeb3b', this)"></div>
            <div class="color-box" style="background: #9c27b0;" onclick="selectColor('#9c27b0', this)"></div>
            <div class="color-box" style="background: #e91e63;" onclick="selectColor('#e91e63', this)"></div>
            <!-- Özel Renk Paletten Seç -->
            <input type="color" class="custom-color-picker" title="Özel Renk Seç" value="#ff5722" onchange="selectColor(this.value, null)">
        </div>

        <!-- Gelişmiş Araçlar ve Kalem Kalınlıkları -->
        <div class="tools">
            <button class="tool-btn size-btn active-size" id="sizeThin" onclick="setLineWidth(3, this)">✏️ İnce</button>
            <button class="tool-btn size-btn" id="sizeNormal" onclick="setLineWidth(8, this)">🖊️ Normal</button>
            <button class="tool-btn size-btn" id="sizeThick" onclick="setLineWidth(16, this)">🖌️️ Kalın</button>
            <button class="tool-btn undo-redo" onclick="undoAction()">↩️ Geri Al</button>
            <button class="tool-btn undo-redo" onclick="redoAction()">🔁 İleri</button>
        </div>
        <div class="tools">
            <button class="tool-btn bucket" id="bucketBtn" onclick="enableBucket()">🪣 Dolgu</button>
            <button class="tool-btn eyedropper" id="eyedropperBtn" onclick="enableEyedropper()">💧 Damlalık</button>
            <button class="tool-btn stamp" id="stampBtn" onclick="enableStamp('⭐')">⭐ Yıldız</button>
            <button class="tool-btn stamp" id="stampBtn2" onclick="enableStamp('❤️')">❤️ Kalp</button>
            <button class="tool-btn eraser" onclick="enableEraser(this)">🧽 Silgi</button>
        </div>
        <div class="tools">
            <button class="tool-btn fullscreen" onclick="toggleFullScreen()">⛶ Tam Ekran / Yatay</button>
            <button class="tool-btn clear" onclick="clearCanvas()">🗑️ Temizle</button>
        </div>

        <!-- Çok Daha Büyük Çocuk İsmi Girişi -->
        <input type="text" id="childName" placeholder="Adını Buraya Yaz (Harfleri Boya!)" oninput="redrawEverything()">

        <!-- Tuval Alanı (Tam Ekran Wrapper İçinde) -->
        <div class="canvas-container" id="canvasContainer">
            <canvas id="paintCanvas" width="480" height="340"></canvas>
        </div>
        
        <br>
        <button class="btn indir" onclick="downloadImage()">📸 Boyadığımı İndir & Kutla 🎉</button>
    </div>

    <!-- BOYAMA KİTAPLARI İNDİRME ALANI -->
    <div class="section">
        <h2>📚 Yazıcı İçin Boyama Kitapları</h2>
        <p>İstediğin boyama kitabını tek tıkla indir!</p>
        
        <div class="library-group">
            <a href="boyama-kitap-01.pdf" class="btn boyama1" target="_blank">🖍️ Boyama Kitabı 1 (PDF)</a>
            <a href="boyama-kitap-02.pdf" class="btn boyama2" target="_blank">🖍️ Boyama Kitabı 2 (PDF)</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;
        let currentColor = '#ff5722';
        let currentLineWidth = 3; 
        let currentTemplate = 'house';
        let activeTool = 'brush'; // 'brush', 'bucket', 'eraser', 'eyedropper', 'stamp'
        let currentStampChar = '⭐';

        // Geri Al / İleri Al (Undo / Redo) Tarihçesi
        let historySteps = [];
        let historyStepIndex = -1;

        // Kullanıcının çizim katmanı
        let userCanvas = document.createElement('canvas');
        userCanvas.width = 480;
        userCanvas.height = 340;
        let userCtx = userCanvas.getContext('2d');

        function playPopSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        function resetUserCanvas() {
            userCtx.fillStyle = '#fff';
            userCtx.fillRect(0, 0, userCanvas.width, userCanvas.height);
        }
        resetUserCanvas();

        function saveState() {
            // İleri adımları temizle ve yeni adımı kaydet
            historySteps = historySteps.slice(0, historyStepIndex + 1);
            historySteps.push(userCtx.getImageData(0, 0, userCanvas.width, userCanvas.height));
            historyStepIndex++;
            if (historySteps.length > 20) { // Bellek koruması için max 20 adım
                historySteps.shift();
                historyStepIndex--;
            }
        }

        function undoAction() {
            if (historyStepIndex > 0) {
                historyStepIndex--;
                userCtx.putImageData(historySteps[historyStepIndex], 0, 0);
                redrawEverything();
                playPopSound();
            }
        }

        function redoAction() {
            if (historyStepIndex < historySteps.length - 1) {
                historyStepIndex++;
                userCtx.putImageData(historySteps[historyStepIndex], 0, 0);
                redrawEverything();
                playPopSound();
            }
        }

        function drawTemplateLines() {
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#333';

            if (currentTemplate === 'house') {
                // Güneş
                ctx.beginPath(); ctx.arc(80, 55, 25, 0, Math.PI * 2); ctx.fillStyle = '#fff9c4'; ctx.fill(); ctx.stroke();
                // Bulut
                ctx.beginPath(); ctx.arc(370, 60, 15, 0, Math.PI * 2); ctx.arc(390, 60, 20, 0, Math.PI * 2); ctx.arc(410, 60, 15, 0, Math.PI * 2); ctx.stroke();
                // Ev Gövdesi
                ctx.strokeRect(160, 130, 160, 120);
                // Çatı
                ctx.beginPath(); ctx.moveTo(135, 130); ctx.lineTo(240, 60); ctx.lineTo(345, 130); ctx.closePath(); ctx.stroke();
                // Kapı
                ctx.strokeRect(215, 180, 50, 70);
                // Pencereler
                ctx.strokeRect(180, 150, 30, 30);
                ctx.strokeRect(270, 150, 30, 30);
            } else if (currentTemplate === 'cat') {
                ctx.beginPath(); ctx.arc(240, 160, 75, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
                // Kulaklar
                ctx.beginPath(); ctx.moveTo(185, 115); ctx.lineTo(175, 55); ctx.lineTo(225, 100); ctx.closePath(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(295, 115); ctx.lineTo(305, 55); ctx.lineTo(255, 100); ctx.closePath(); ctx.stroke();
                // Gözler ve Burun
                ctx.beginPath(); ctx.arc(210, 145, 8, 0, Math.PI * 2); ctx.fillStyle = '#333'; ctx.fill();
                ctx.beginPath(); ctx.arc(270, 145, 8, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(240, 165, 5, 0, Math.PI * 2); ctx.fill();
                // Bıyıklar
                ctx.beginPath(); ctx.moveTo(175, 170); ctx.lineTo(135, 162); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(175, 185); ctx.lineTo(135, 190); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(305, 170); ctx.lineTo(345, 162); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(305, 185); ctx.lineTo(345, 190); ctx.stroke();
            } else if (currentTemplate === 'rocket') {
                ctx.beginPath(); ctx.arc(240, 120, 40, Math.PI, 0, false); ctx.lineTo(280, 210); ctx.lineTo(200, 210); ctx.closePath(); ctx.stroke();
                // Kanatlar
                ctx.beginPath(); ctx.moveTo(200, 170); ctx.lineTo(165, 210); ctx.lineTo(200, 210); ctx.closePath(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(280, 170); ctx.lineTo(315, 210); ctx.lineTo(280, 210); ctx.closePath(); ctx.stroke();
                // Pencere
                ctx.beginPath(); ctx.arc(240, 115, 14, 0, Math.PI * 2); ctx.stroke();
                // Alevler
                ctx.beginPath(); ctx.moveTo(220, 210); ctx.lineTo(240, 250); ctx.lineTo(260, 210); ctx.closePath(); ctx.stroke();
            }

            // Çocuğun İsmi (Daha Büyük Harf Boyama Yazısı)
            const nameInput = document.getElementById('childName').value.trim().toUpperCase();
            const displayName = nameInput !== "" ? nameInput : "SANATÇI";
            
            ctx.font = "bold 30px Arial";
            ctx.textAlign = "center";
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = "#333";
            ctx.fillStyle = "rgba(0,0,0,0)";
            ctx.strokeText(displayName, canvas.width / 2, 305);
        }

        function redrawEverything() {
            ctx.drawImage(userCanvas, 0, 0);
            drawTemplateLines();
        }

        function initCanvas() {
            resetUserCanvas();
            userCtx.lineWidth = 3;
            userCtx.strokeStyle = '#ccc';
            userCtx.strokeRect(10, 10, userCanvas.width - 20, userCanvas.height - 20);
            
            historySteps = [];
            historyStepIndex = -1;
            saveState();

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            redrawEverything();
        }
        initCanvas();

        function setTemplate(tpl, btn) {
            currentTemplate = tpl;
            setActiveTool('brush');
            document.querySelectorAll('.tpl-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            initCanvas();
            playPopSound();
        }

        function setLineWidth(width, btn) {
            currentLineWidth = width;
            if(activeTool === 'eraser') setActiveTool('brush');
            else if(activeTool !== 'brush') setActiveTool('brush');
            
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active-size'));
            if(btn) btn.classList.add('active-size');
            playPopSound();
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX, clientY = e.clientY;
            if (e.touches && e.touches[0]) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            // Tam ekran oran optimizasyonu
            let scaleX = canvas.width / rect.width;
            let scaleY = canvas.height / rect.height;
            return { 
                x: (clientX - rect.left) * scaleX, 
                y: (clientY - rect.top) * scaleY 
            };
        }

        // Akıllı Flood Fill (Kova Dolgu)
        function floodFill(startX, startY, fillColorHex) {
            redrawEverything();
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imgData.data;

            const startPos = (Math.floor(startY) * canvas.width + Math.floor(startX)) * 4;
            const startR = pixels[startPos];
            const startG = pixels[startPos + 1];
            const startB = pixels[startPos + 2];

            if (startR < 50 && startG < 50 && startB < 50) return;

            let tempC = document.createElement('canvas').getContext('2d');
            tempC.fillStyle = fillColorHex;
            tempC.fillRect(0,0,1,1);
            let cData = tempC.getImageData(0,0,1,1).data;
            const targetR = cData[0], targetG = cData[1], targetB = cData[2];

            if (startR === targetR && startG === targetG && startB === targetB) return;

            const userImgData = userCtx.getImageData(0, 0, userCanvas.width, userCanvas.height);
            const userPixels = userImgData.data;

            let queue = [[Math.floor(startX), Math.floor(startY)]];
            let visited = new Uint8Array(canvas.width * canvas.height);

            while (queue.length > 0) {
                let [x, y] = queue.pop();
                let idx = (y * canvas.width + x);

                if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) continue;
                if (visited[idx]) continue;
                visited[idx] = 1;

                let pIdx = idx * 4;
                let r = pixels[pIdx], g = pixels[pIdx+1], b = pixels[pIdx+2];

                if (r < 60 && g < 60 && b < 60) continue;

                if (Math.abs(r - startR) + Math.abs(g - startG) + Math.abs(b - startB) < 60) {
                    userPixels[pIdx] = targetR;
                    userPixels[pIdx+1] = targetG;
                    userPixels[pIdx+2] = targetB;
                    userPixels[pIdx+3] = 255;

                    pixels[pIdx] = targetR;
                    pixels[pIdx+1] = targetG;
                    pixels[pIdx+2] = targetB;

                    queue.push([x + 1, y]);
                    queue.push([x - 1, y]);
                    queue.push([x, y + 1], [x, y - 1]);
                }
            }

            userCtx.putImageData(userImgData, 0, 0);
            redrawEverything();
            saveState();
        }

        // Damlalık (Eyedropper) Fonksiyonu
        function pickColor(x, y) {
            redrawEverything();
            const pixel = ctx.getImageData(x, y, 1, 1).data;
            // Eğer siyah çizgiye tıklandıysa renk seçme
            if (pixel[0] < 50 && pixel[1] < 50 && pixel[2] < 50) return;
            
            const hex = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1);
            currentColor = hex;
            setActiveTool('brush');
            playPopSound();
        }

        // Pul / Damga (Stamp) Bırakma Fonksiyonu
        function placeStamp(x, y, char) {
            userCtx.font = "32px Arial";
            userCtx.textAlign = "center";
            userCtx.textBaseline = "middle";
            userCtx.fillText(char, x, y);
            redrawEverything();
            saveState();
            playPopSound();
        }

        function startAction(e) {
            const pos = getMousePos(e);
            
            if (activeTool === 'bucket') {
                floodFill(pos.x, pos.y, currentColor);
                playPopSound();
                return;
            } else if (activeTool === 'eyedropper') {
                pickColor(pos.x, pos.y);
                return;
            } else if (activeTool === 'stamp') {
                placeStamp(pos.x, pos.y, currentStampChar);
                return;
            }

            painting = true;
            userCtx.beginPath();
            userCtx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function endPosition() {
            if (!painting) return;
            painting = false;
            userCtx.beginPath();
            saveState();
        }

        function draw(e) {
            if (!painting || activeTool === 'bucket' || activeTool === 'eyedropper' || activeTool === 'stamp') return;
            e.preventDefault();
            const pos = getMousePos(e);

            userCtx.lineWidth = currentLineWidth;
            userCtx.lineCap = 'round';
            userCtx.lineJoin = 'round';
            userCtx.strokeStyle = currentColor;

            userCtx.lineTo(pos.x, pos.y);
            userCtx.stroke();
            userCtx.beginPath();
            userCtx.moveTo(pos.x, pos.y);

            redrawEverything();
        }

        canvas.addEventListener('mousedown', startAction);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', startAction, { passive: false });
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw, { passive: false });

        function selectColor(color, element) {
            currentColor = color;
            if (activeTool !== 'brush' && activeTool !== 'eraser') setActiveTool('brush');
            document.querySelectorAll('.color-box').forEach(b => b.classList.remove('active'));
            if(element) element.classList.add('active');
            playPopSound();
        }

        function setActiveTool(tool) {
            activeTool = tool;
            document.getElementById('bucketBtn').classList.remove('active-bucket');
            document.getElementById('eyedropperBtn').classList.remove('active-eyedropper');
            
            if (tool === 'bucket') document.getElementById('bucketBtn').classList.add('active-bucket');
            if (tool === 'eyedropper') document.getElementById('eyedropperBtn').classList.add('active-eyedropper');
        }

        function enableEraser(element) {
            currentColor = '#ffffff';
            currentLineWidth = 20;
            setActiveTool('brush');
            playPopSound();
        }

        function enableBucket() {
            setActiveTool('bucket');
            playPopSound();
        }

        function enableEyedropper() {
            setActiveTool('eyedropper');
            playPopSound();
        }

        function enableStamp(char) {
            activeTool = 'stamp';
            currentStampChar = char;
            playPopSound();
        }

        function toggleFullScreen() {
            const container = document.getElementById('canvasContainer');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
            playPopSound();
        }

        function clearCanvas() {
            setActiveTool('brush');
            initCanvas();
            playPopSound();
        }

        function downloadImage() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });

            redrawEverything();
            const link = document.createElement('a');
            link.download = 'minik-sanatci-boyama.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
