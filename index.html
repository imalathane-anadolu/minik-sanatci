<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ücretsiz Çocuk Boyama Kitabı & Online Boyama</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #fdfbf7; color: #333; text-align: center; padding: 20px; }
        header { background: #ffdf6d; padding: 25px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #ff5722; font-size: 26px; margin-bottom: 10px; }
        p { color: #555; font-size: 15px; margin-bottom: 15px; }
        .btn { background: #ff5722; color: white; border: none; padding: 14px 28px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; text-decoration: none; display: inline-block; box-shadow: 0 4px 10px rgba(255,87,34,0.3); transition: 0.2s; margin: 10px 5px; }
        .btn:hover { background: #f4511e; transform: scale(1.03); }
        .section { background: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        input[type="text"] { padding: 12px; font-size: 16px; border: 2px solid #ddd; border-radius: 10px; width: 80%; max-width: 300px; margin-bottom: 15px; text-align: center; }
        .palette { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .color-box { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        canvas { background: #fff; border: 3px dashed #ffdf6d; border-radius: 15px; max-width: 100%; cursor: crosshair; }
        .name-output { font-size: 24px; font-weight: bold; letter-spacing: 3px; color: #444; margin-top: 10px; text-transform: uppercase; -webkit-text-stroke: 1px #ff5722; }
    </style>
</head>
<body>

    <header>
        <h1>🎨 Ücretsiz Boyama Kitabı</h1>
        <p>Hemen indir veya tarayıcında hemen boyamaya başla!</p>
        <a href="#" class="btn">📥 Ücretsiz PDF'i İndir</a>
    </header>

    <div class="section">
        <h2>✨ Küçük Sanatçı Atölyesi</h2>
        <p>Çocuğun adını yaz, renkleri seç ve boyamaya başla!</p>
        
        <input type="text" id="childName" placeholder="Sanatçının Adı (Örn: ZEYNEP)" oninput="updateName()">
        
        <div class="palette">
            <div class="color-box" style="background: #ff5722;" onclick="selectColor('#ff5722')"></div>
            <div class="color-box" style="background: #4caf50;" onclick="selectColor('#4caf50')"></div>
            <div class="color-box" style="background: #2196f3;" onclick="selectColor('#2196f3')"></div>
            <div class="color-box" style="background: #ffeb3b;" onclick="selectColor('#ffeb3b')"></div>
            <div class="color-box" style="background: #9c27b0;" onclick="selectColor('#9c27b0')"></div>
            <div class="color-box" style="background: #ffffff; border: 2px solid #ccc;" onclick="selectColor('#ffffff')"></div>
        </div>

        <canvas id="paintCanvas" width="300" height="200"></canvas>
        <div id="displayName" class="name-output">SANATÇI</div>
        
        <br>
        <button class="btn" onclick="downloadImage()" style="background: #4caf50; font-size: 15px; padding: 10px 20px;">📸 Boyadığımı İndir / Çıktı Al</button>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let currentColor = '#ff5722';

        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#333';
        ctx.strokeRect(20, 20, 260, 160);
        ctx.font = "16px Arial";
        ctx.fillStyle = "#666";
        ctx.fillText("Boyama Alanı (Dokun & Boya)", 50, 105);

        function selectColor(color) { currentColor = color; }

        canvas.addEventListener('click', function(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.fillStyle = currentColor;
            ctx.beginPath();
            ctx.arc(x, y, 15, 0, Math.PI * 2);
            ctx.fill();
        });

        function updateName() {
            const nameVal = document.getElementById('childName').value;
            document.getElementById('displayName').innerText = nameVal ? nameVal : 'SANATÇI';
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'boyama-calismasi.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
