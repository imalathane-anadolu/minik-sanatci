<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minik Sanatçı - Çocuk Boyama ve Aktivite Dünyası</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #fdfbf7; color: #333; text-align: center; padding: 10px; }
        
        /* Başlık Alanı */
        header { background: #ffdf6d; padding: 15px; border-radius: 20px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #ff5722; font-size: 22px; margin-bottom: 5px; }
        p { color: #555; font-size: 13px; }

        /* Bölüm Kutuları */
        .section { background: white; padding: 15px 10px; border-radius: 20px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .section h2 { color: #333; font-size: 18px; margin-bottom: 8px; }

        /* Tuval Alanı Genişletildi */
        input[type="text"] { padding: 10px; font-size: 16px; border: 2px solid #ffcc80; border-radius: 12px; width: 90%; max-width: 340px; margin-bottom: 10px; text-align: center; font-weight: bold; color: #ff5722; background: #fffdf9; }
        .palette { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .color-box { width: 38px; height: 38px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .color-box.active { border: 3px solid #333; transform: scale(1.15); }
        
        /* Tuval (Genişliği artırıldı) */
        canvas { background: #fff; border: 3px dashed #ffb74d; border-radius: 15px; width: 100%; max-width: 360px; height: 280px; touch-action: none; cursor: crosshair; display: block; margin: 0 auto; }
        
        .tools { margin: 8px 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .tool-btn { background: #ff9800; color: white; border: none; padding: 8px 14px; font-size: 13px; font-weight: bold; border-radius: 20px; cursor: pointer; }
        .tool-btn.eraser { background: #78909c; }
        .tool-btn.clear { background: #e53935; }
        
        .name-output { font-size: 20px; font-weight: bold; letter-spacing: 2px; color: #ff5722; margin: 8px 0; text-transform: uppercase; }

        /* Butonlar */
        .btn { background: #2196f3; color: white; border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 30px; cursor: pointer; text-decoration: none; display: inline-block; box-shadow: 0 4px 10px rgba(33,150,243,0.3); transition: 0.2s; margin: 6px 4px; width: 90%; max-width: 320px; text-align: center; }
        .btn:hover { transform: scale(1.02); }
        .btn.boyama1 { background: #4caf50; }
        .btn.boyama2 { background: #ff9800; }
        .btn.indir { background: #e91e63; }

        .library-group { display: flex; flex-direction: column; gap: 8px; align-items: center; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- ÜST BİLGİ -->
    <header>
        <h1>🎨 Minik Sanatçı Boyama Dünyası</h1>
        <p>Dijital Tuvalde Boya & Boyama Kitaplarını İndir!</p>
    </header>

    <!-- DİJİTAL BOYAMA TUVALİ -->
    <div class="section">
        <h2>✨ Parmakla Boyama Tuvali</h2>
        
        <input type="text" id="childName" placeholder="Sanatçının Adını Yaz (Örn: HASAN)" oninput="updateName()">
        
        <div class="palette">
            <div class="color-box active" style="background: #ff5722;" onclick="selectColor('#ff5722', this)"></div>
            <div class="color-box" style="background: #4caf50;" onclick="selectColor('#4caf50', this)"></div>
            <div class="color-box" style="background: #2196f3;" onclick="selectColor('#2196f3', this)"></div>
            <div class="color-box" style="background: #ffeb3b;" onclick="selectColor('#ffeb3b', this)"></div>
            <div class="color-box" style="background: #9c27b0;" onclick="selectColor('#9c27b0', this)"></div>
            <div class="color-box" style="background: #e91e63;" onclick="selectColor('#e91e63', this)"></div>
        </div>

        <div class="tools">
            <button class="tool-btn eraser" onclick="enableEraser(this)">🧽 Silgi</button>
            <button class="tool-btn clear" onclick="clearCanvas()">🗑️ Temizle</button>
        </div>

        <!-- Tuval Boyutları Genişletildi -->
        <canvas id="paintCanvas" width="360" height="280"></canvas>
        <div id="displayName" class="name-output">SANATÇI</div>
        
        <button class="btn indir" onclick="downloadImage()">📸 Boyadığımı İndir</button>
    </div>

    <!-- BOYAMA KİTAPLARI İNDİRME ALANI -->
    <div class="section">
        <h2>📚 Yazıcı İçin Boyama Kitapları</h2>
        <p>İstediğin boyama kitabını tek tıkla indir!</p>
        
        <div class="library-group">
            <a href="boyama-kitap-01.pdf" class="btn boyama1" target="_blank">🖍️ Boyama Kitabı 1 (PDF)</a>
            <a href="boyama-kitap-02.pdf" class="btn boyama2" target="_blank">🖍️ Boyama Kitabı 2 (PDF)</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;
        let currentColor = '#ff5722';
        let currentLineWidth = 12;

        // Pano açıldığında içine sevimli bir çizim (Ev ve Güneş) koyuyoruz
        function initCanvas() {
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Çerçeve
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ccc';
            ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

            // Sevimli Çizim Başlangıcı (Örn: Basit bir ev ve güneş figürü)
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#444';

            // Güneş
            ctx.beginPath();
            ctx.arc(60, 60, 25, 0, Math.PI * 2);
            ctx.fillStyle = '#fff9c4';
            ctx.fill();
            ctx.stroke();

            // Evin gövdesi
            ctx.strokeRect(130, 130, 100, 100);

            // Evin çatısı
            ctx.beginPath();
            ctx.moveTo(115, 130);
            ctx.lineTo(180, 70);
            ctx.lineTo(245, 130);
            ctx.closePath();
            ctx.stroke();

            // Kapı
            ctx.strokeRect(165, 175, 30, 55);

            // İpucu Yazısı
            ctx.font = "14px Arial";
            ctx.fillStyle = "#aaa";
            ctx.fillText("Burayı rengarenk boya! 🎨", 105, 260);
        }
        initCanvas();

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches[0]) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startPosition(e) {
            painting = true;
            const pos = getMousePos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function endPosition() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting) return;
            e.preventDefault();
            
            const pos = getMousePos(e);

            ctx.lineWidth = currentLineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = currentColor;

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', startPosition, { passive: false });
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw, { passive: false });

        function selectColor(color, element) {
            currentColor = color;
            currentLineWidth = 12;
            document.querySelectorAll('.color-box').forEach(b => b.classList.remove('active'));
            if(element) element.classList.add('active');
        }

        function enableEraser(element) {
            currentColor = '#ffffff';
            currentLineWidth = 25;
            document.querySelectorAll('.color-box').forEach(b => b.classList.remove('active'));
        }

        function clearCanvas() {
            initCanvas();
        }

        function updateName() {
            const nameVal = document.getElementById('childName').value;
            document.getElementById('displayName').innerText = nameVal ? nameVal : 'SANATÇI';
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'minik-sanatci-boyama.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
