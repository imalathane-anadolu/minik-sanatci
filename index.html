<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijital Boyama Kitabı</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            z-index: 10;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-area h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* En Üstteki Kitaplar / Şablon Menüsü */
        .books-menu-bar {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
            align-items: center;
            z-index: 9;
            box-shadow: inset 0 -2px 4px rgba(0,0,0,0.02);
        }

        .book-tab {
            padding: 6px 14px;
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
            transition: all 0.2s;
        }

        .book-tab:hover {
            background: #e2e8f0;
            color: var(--text-color);
        }

        .book-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        .canvas-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            align-items: center;
        }

        .canvas-wrapper {
            position: relative;
            width: 600px;
            height: 600px;
            background: white;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #bgCanvas {
            z-index: 1;
        }

        #drawCanvas {
            z-index: 2;
            cursor: crosshair;
        }

        /* Çizim Ekranı Altındaki Parametreler ve Komutlar */
        .bottom-controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            width: 600px;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
        }

        .btn {
            background: white;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        .btn:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        /* Sağ Panel: Araçlar ve Renkler */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 300px;
        }

        .panel-card {
            background: var(--panel-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .tool-btn {
            padding: 10px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #f1f5f9;
        }

        .tool-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .color-swatch {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 0 1px var(--border-color);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-swatch:hover {
            transform: scale(1.1);
        }

        .color-swatch.active {
            box-shadow: 0 0 0 2px var(--primary);
            transform: scale(1.1);
        }

        .custom-color-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .custom-color-row input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .custom-color-row input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .custom-color-row input[type="color"]::-webkit-color-swatch {
            border: 2px solid var(--border-color);
            border-radius: 50%;
        }

        /* Şablon Seçici Modal / Izgara */
        .template-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .template-thumb {
            aspect-ratio: 1;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: #94a3b8;
            overflow: hidden;
            transition: all 0.2s;
        }

        .template-thumb:hover {
            border-color: var(--primary);
        }

        .template-thumb.active {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        .template-thumb canvas {
            width: 100%;
            height: 100%;
        }

        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column;
                align-items: center;
            }
            .sidebar {
                width: 600px;
            }
        }

        @media (max-width: 650px) {
            .canvas-wrapper, .bottom-controls-bar, .sidebar {
                width: 100%;
                max-width: 400px;
            }
            .canvas-wrapper {
                height: 400px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>🎨 Dijital Boyama Kitabı</h1>
        </div>
        <div class="header-actions">
            <button class="btn" id="clearBtn">🧹 Temizle</button>
            <button class="btn btn-primary" id="saveBtn">💾 İndir</button>
        </div>
    </header>

    <!-- En Üstteki Kitaplar / Şablon Menüsü -->
    <div class="books-menu-bar" id="booksMenuBar">
        <!-- JS ile dinamik doldurulacak -->
    </div>

    <div class="main-container">
        <!-- Sol/Orta Alan: Çizim Ekranı ve Alt Parametreler -->
        <div class="canvas-section">
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="bgCanvas"></canvas>
                <canvas id="drawCanvas"></canvas>
            </div>

            <!-- Çizim Ekranı Altında Parametreler ve Komutlar -->
            <div class="bottom-controls-bar">
                <div class="control-group">
                    <label for="brushSize">Boyut:</label>
                    <input type="range" id="brushSize" min="1" max="50" value="12" style="width: 100px;">
                    <span id="brushSizeVal" style="font-size: 0.8rem; width: 25px;">12px</span>
                </div>
                <div class="control-group">
                    <label for="brushOpacity">Şeffaflık:</label>
                    <input type="range" id="brushOpacity" min="0.1" max="1" step="0.1" value="1" style="width: 80px;">
                </div>
                <div class="control-group">
                    <button class="btn" id="undoBtn" title="Geri Al">↩️ Geri Al</button>
                    <button class="btn" id="redoBtn" title="İleri Al">↪️ İleri Al</button>
                </div>
            </div>
        </div>

        <!-- Sağ Panel: Araçlar ve Renkler -->
        <div class="sidebar">
            <div class="panel-card">
                <div class="panel-title">Araçlar</div>
                <div class="tools-grid">
                    <button class="tool-btn active" data-tool="brush">🖌️ Fırça</button>
                    <button class="tool-btn" data-tool="bucket">🪣 Dolgu Kovası</button>
                    <button class="tool-btn" data-tool="eraser">橡 Silgi</button>
                    <button class="tool-btn" data-tool="eyedropper"> eyedrop Damlalık</button>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-title">Renk Paleti</div>
                <div class="palette-grid" id="colorPalette">
                    <!-- Palet renkleri -->
                </div>
                <div class="custom-color-row">
                    <input type="color" id="customColorPicker" value="#4f46e5">
                    <label for="customColorPicker" style="font-size: 0.85rem; font-weight: 600; color: #475569;">Özel Renk Seç</label>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-title">Şablonlar (<span id="templateCount">0</span>)</div>
                <div class="template-selector" id="templateSelector">
                    <!-- Şablonlar -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 50 Adet Örnek Çizim Şablonu Kategorileri/İsimleri
        const templates = Array.from({ length: 50 }, (_, i) => ({
            id: i + 1,
            title: `Şablon ${i + 1}`,
            category: i < 15 ? 'Doğa ve Hayvanlar' : i < 30 ? 'Araçlar & Mekanik' : 'Geometrik & Fantezi'
        }));

        let currentTemplateId = 1;
        let currentTool = 'brush';
        let currentColor = '#4f46e5';
        let brushSize = 12;
        let brushOpacity = 1;

        const bgCanvas = document.getElementById('bgCanvas');
        const drawCanvas = document.getElementById('drawCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const ctx = drawCanvas.getContext('2d');

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // Geçmiş (Undo/Redo)
        let history = [];
        let historyStep = -1;

        function initCanvasSize() {
            const size = 600;
            bgCanvas.width = size;
            bgCanvas.height = size;
            drawCanvas.width = size;
            drawCanvas.height = size;
            drawTemplate(currentTemplateId);
        }

        // Örnek Şablon Çizimi (Vektörel Çizgiler üretiyoruz)
        function drawTemplate(id) {
            bgCtx.fillStyle = '#ffffff';
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

            bgCtx.strokeStyle = '#1e293b';
            bgCtx.lineWidth = 4;
            bgCtx.lineCap = 'round';
            bgCtx.lineJoin = 'round';

            bgCtx.save();
            bgCtx.translate(300, 300);

            switch ((id - 1) % 6) {
                case 0: // Geometrik Çiçek / Mandala tarzı
                    for (let i = 0; i < 12; i++) {
                        bgCtx.beginPath();
                        bgCtx.arc(0, 0, 150 + (id * 2) % 50, 0, Math.PI * 2);
                        bgCtx.stroke();
                        bgCtx.rotate(Math.PI / 6);
                    }
                    bgCtx.beginPath();
                    bgCtx.arc(0, 0, 60, 0, Math.PI * 2);
                    bgCtx.stroke();
                    break;
                case 1: // Yıldız ve Çokgenler
                    bgCtx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        bgCtx.lineTo(Math.cos((i * 4 * Math.PI) / 5) * 180, Math.sin((i * 4 * Math.PI) / 5) * 180);
                    }
                    bgCtx.closePath();
                    bgCtx.stroke();
                    bgCtx.beginPath();
                    bgCtx.arc(0, 0, 180, 0, Math.PI * 2);
                    bgCtx.stroke();
                    break;
                case 2: // Ev / Manzara Çizgisi
                    bgCtx.strokeRect(-100, -50, 200, 150);
                    bgCtx.beginPath();
                    bgCtx.moveTo(-120, -50);
                    bgCtx.lineTo(0, -150);
                    bgCtx.lineTo(120, -50);
                    bgCtx.closePath();
                    bgCtx.stroke();
                    bgCtx.strokeRect(-40, 30, 80, 70);
                    break;
                case 3: // Spiral / Dalgalar
                    bgCtx.beginPath();
                    let r = 10;
                    for (let a = 0; a < 30; a += 0.1) {
                        let x = r * a * Math.cos(a);
                        let y = r * a * Math.sin(a);
                        if (a === 0) bgCtx.moveTo(x, y);
                        else bgCtx.lineTo(x, y);
                    }
                    bgCtx.stroke();
                    break;
                case 4: // Soyut Çerçeveler
                    bgCtx.strokeRect(-180, -180, 360, 360);
                    bgCtx.strokeRect(-140, -140, 280, 280);
                    bgCtx.beginPath();
                    bgCtx.arc(0, 0, 100, 0, Math.PI * 2);
                    bgCtx.stroke();
                    break;
                case 5: // Sevimli Hayvan / Ayı Silüeti Taslağı
                    bgCtx.beginPath();
                    bgCtx.arc(0, 20, 100, 0, Math.PI * 2); // Gövde
                    bgCtx.arc(0, -90, 70, 0, Math.PI * 2);  // Kafa
                    bgCtx.arc(-60, -140, 35, 0, Math.PI * 2); // Kulak Sol
                    bgCtx.arc(60, -140, 35, 0, Math.PI * 2);  // Kulak Sağ
                    bgCtx.stroke();
                    break;
            }

            bgCtx.restore();
            ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            saveState();
        }

        // Üst Menü Kitap Sekmelerini Oluşturma
        function initBooksMenu() {
            const menuBar = document.getElementById('booksMenuBar');
            menuBar.innerHTML = '';
            
            // Gruplara ayıralım veya ilk 10-15 şablonu hızlıca gösterelim
            templates.forEach((tmpl) => {
                const tab = document.createElement('div');
                tab.className = `book-tab ${tmpl.id === currentTemplateId ? 'active' : ''}`;
                tab.textContent = tmpl.title;
                tab.onclick = () => {
                    document.querySelectorAll('.book-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentTemplateId = tmpl.id;
                    drawTemplate(currentTemplateId);
                    updateThumbnailActiveState();
                };
                menuBar.appendChild(tab);
            });
        }

        // Sağ panel şablon küçük resimlerini oluşturma
        function initTemplates() {
            const container = document.getElementById('templateSelector');
            document.getElementById('templateCount').textContent = templates.length;
            container.innerHTML = '';

            templates.forEach((tmpl) => {
                const thumb = document.createElement('div');
                thumb.className = `template-thumb ${tmpl.id === currentTemplateId ? 'active' : ''}`;
                
                const c = document.createElement('canvas');
                c.width = 100;
                c.height = 100;
                thumb.appendChild(c);

                // Önizleme minyatürü çiz
                const tCtx = c.getContext('2d');
                tCtx.fillStyle = '#fff';
                tCtx.fillRect(0, 0, 100, 100);
                tCtx.strokeStyle = '#1e293b';
                tCtx.lineWidth = 2;
                tCtx.save();
                tCtx.translate(50, 50);
                tCtx.scale(0.3, 0.3);
                
                // Basit ikonik çizim
                tCtx.beginPath();
                tCtx.arc(0, 0, 80, 0, Math.PI * 2);
                tCtx.stroke();
                tCtx.restore();

                thumb.onclick = () => {
                    currentTemplateId = tmpl.id;
                    drawTemplate(currentTemplateId);
                    updateThumbnailActiveState();
                    updateBooksMenuState();
                };

                container.appendChild(thumb);
            });
        }

        function updateThumbnailActiveState() {
            document.querySelectorAll('.template-thumb').forEach((el, idx) => {
                if (idx + 1 === currentTemplateId) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        function updateBooksMenuState() {
            document.querySelectorAll('.book-tab').forEach((el, idx) => {
                if (idx + 1 === currentTemplateId) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        // Renk Paleti
        const paletteColors = [
            '#000000', '#ffffff', '#ef4444', '#f97316', '#f59e0b',
            '#10b981', '#06b6d4', '#3b82f6', '#6366f1', '#ec4899',
            '#78716c', '#94a3b8', '#84cc16', '#14b8a6', '#8b5cf6'
        ];

        function initPalette() {
            const paletteGrid = document.getElementById('colorPalette');
            paletteGrid.innerHTML = '';
            paletteColors.forEach((color, index) => {
                const swatch = document.createElement('div');
                swatch.className = `color-swatch ${index === 0 ? 'active' : ''}`;
                swatch.style.backgroundColor = color;
                swatch.onclick = () => {
                    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');
                    currentColor = color;
                    document.getElementById('customColorPicker').value = color;
                };
                paletteGrid.appendChild(swatch);
            });
        }

        // Geri Al / İleri Al Mekanizması
        function saveState() {
            historyStep++;
            if (historyStep < history.length) {
                history.length = historyStep;
            }
            history.push(ctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
        }

        document.getElementById('undoBtn').onclick = () => {
            if (historyStep > 0) {
                historyStep--;
                ctx.putImageData(history[historyStep], 0, 0);
            }
        };

        document.getElementById('redoBtn').onclick = () => {
            if (historyStep < history.length - 1) {
                historyStep++;
                ctx.putImageData(history[historyStep], 0, 0);
            }
        };

        // Çizim Olayları (Mouse & Touch)
        function getCoords(e) {
            const rect = drawCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (drawCanvas.width / rect.width),
                y: (clientY - rect.top) * (drawCanvas.height / rect.height)
            };
        }

        drawCanvas.addEventListener('mousedown', startDrawing);
        drawCanvas.addEventListener('mousemove', draw);
        drawCanvas.addEventListener('mouseup', stopDrawing);
        drawCanvas.addEventListener('mouseleave', stopDrawing);

        drawCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
        drawCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
        drawCanvas.addEventListener('touchend', (e) => { e.preventDefault(); stopDrawing(); });

        function startDrawing(e) {
            const coords = getCoords(e);
            isDrawing = true;
            lastX = coords.x;
            lastY = coords.y;

            if (currentTool === 'bucket') {
                floodFill(Math.floor(lastX), Math.floor(lastY), hexToRgba(currentColor));
                saveState();
                isDrawing = false;
            } else if (currentTool === 'eyedropper') {
                pickColor(Math.floor(lastX), Math.floor(lastY));
                isDrawing = false;
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            const coords = getCoords(e);

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(coords.x, coords.y);

            if (currentTool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = brushSize * 2;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = hexToRgba(currentColor, brushOpacity);
                ctx.lineWidth = brushSize;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            }

            ctx.stroke();
            lastX = coords.x;
            lastY = coords.y;
        }

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                saveState();
            }
        }

        // Basit Flood Fill (Dolgu Kovası) Algoritması
        function hexToRgba(hex, alpha = 1) {
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            return [num >> 16, (num >> 8) & 255, num & 255, Math.round(alpha * 255)];
        }

        function floodFill(startX, startY, fillColor) {
            const imgData = ctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
            const data = imgData.data;
            const width = drawCanvas.width;
            const height = drawCanvas.height;

            const startIndex = (startY * width + startX) * 4;
            const startR = data[startIndex];
            const startG = data[startIndex + 1];
            const startB = data[startIndex + 2];
            const startA = data[startIndex + 3];

            if (startR === fillColor[0] && startG === fillColor[1] && startB === fillColor[2] && startA === fillColor[3]) return;

            // Sınır çizgileri için siyah renk kontrolü (bgCanvas kontrolü)
            const bgData = bgCtx.getImageData(0, 0, width, height).data;

            const queue = [[startX, startY]];
            const visited = new Uint8Array(width * height);

            while (queue.length > 0) {
                const [x, y] = queue.pop();
                if (x < 0 || x >= width || y < 0 || y >= height) continue;

                const idx = (y * width + x);
                if (visited[idx]) continue;
                visited[idx] = 1;

                const pIdx = idx * 4;
                // Arka plan çizgilerine denk geliyorsa dur
                if (bgData[pIdx] < 50 && bgData[pIdx + 1] < 50 && bgData[pIdx + 2] < 50) continue;

                // Benzer renk kontrolü
                const r = data[pIdx];
                const g = data[pIdx + 1];
                const b = data[pIdx + 2];
                const a = data[pIdx + 3];

                if (Math.abs(r - startR) < 15 && Math.abs(g - startG) < 15 && Math.abs(b - startB) < 15 && Math.abs(a - startA) < 15) {
                    data[pIdx] = fillColor[0];
                    data[pIdx + 1] = fillColor[1];
                    data[pIdx + 2] = fillColor[2];
                    data[pIdx + 3] = fillColor[3];

                    queue.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        function pickColor(x, y) {
            const p = ctx.getImageData(x, y, 1, 1).data;
            if (p[3] > 0) {
                const hex = '#' + [p[0], p[1], p[2]].map(x => x.toString(16).padStart(2, '0')).join('');
                currentColor = hex;
                document.getElementById('customColorPicker').value = hex;
            }
        }

        // Araç Seçimi Butonları
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.dataset.tool;
            };
        });

        // Boyut ve Opaklık Kontrolleri
        const brushSizeInput = document.getElementById('brushSize');
        const brushSizeVal = document.getElementById('brushSizeVal');
        brushSizeInput.oninput = (e) => {
            brushSize = e.target.value;
            brushSizeVal.textContent = brushSize + 'px';
        };

        document.getElementById('brushOpacity').oninput = (e) => {
            brushOpacity = e.target.value;
        };

        document.getElementById('customColorPicker').oninput = (e) => {
            currentColor = e.target.value;
            document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
        };

        // Temizle ve Kaydet
        document.getElementById('clearBtn').onclick = () => {
            ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            saveState();
        };

        document.getElementById('saveBtn').onclick = () => {
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = 600;
            finalCanvas.height = 600;
            const fCtx = finalCanvas.getContext('2d');
            fCtx.drawImage(bgCanvas, 0, 0);
            fCtx.drawImage(drawCanvas, 0, 0);

            const link = document.createElement('a');
            link.download = `boyama-${currentTemplateId}.png`;
            link.href = finalCanvas.toDataURL();
            link.link = '';
            link.click();
        };

        // Başlangıç Çalıştırma
        window.onload = () => {
            initBooksMenu();
            initTemplates();
            initPalette();
            initCanvasSize();
        };
    </script>
</body>
</html>
