<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minik Sanatçı - Çocuk Boyama ve Aktivite Dünyası</title>
    <!-- Konfeti Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #fdfbf7; color: #333; text-align: center; padding: 10px; }
        
        /* Başlık Alanı */
        header { background: #ffdf6d; padding: 15px; border-radius: 20px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #ff5722; font-size: 22px; margin-bottom: 5px; }
        p { color: #555; font-size: 13px; }

        /* Bölüm Kutuları */
        .section { background: white; padding: 15px 10px; border-radius: 20px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .section h2 { color: #333; font-size: 18px; margin-bottom: 8px; }

        /* Şablon Seçim Butonları */
        .template-group { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        .tpl-btn { background: #ab47bc; color: white; border: none; padding: 6px 12px; font-size: 12px; font-weight: bold; border-radius: 15px; cursor: pointer; }
        .tpl-btn.active { background: #7b1fa2; transform: scale(1.05); }

        /* Renk Paleti */
        .palette { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .color-box { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .color-box.active { border: 3px solid #333; transform: scale(1.15); }

        /* Araçlar ve Kalem Boyutları */
        .tools { margin: 8px 0; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
        .tool-btn { background: #ff9800; color: white; border: none; padding: 7px 12px; font-size: 12px; font-weight: bold; border-radius: 20px; cursor: pointer; }
        .tool-btn.size-btn { background: #607d8b; }
        .tool-btn.size-btn.active-size { background: #263238; border: 2px solid #ffeb3b; }
        .tool-btn.eraser { background: #78909c; }
        .tool-btn.bucket { background: #00acc1; }
        .tool-btn.bucket.active-bucket { background: #006064; border: 2px solid #ffeb3b; }
        .tool-btn.clear { background: #e53935; }

        /* Tuval Alanı */
        canvas { background: #fff; border: 3px dashed #ffb74d; border-radius: 15px; width: 100%; max-width: 360px; height: 280px; touch-action: none; cursor: crosshair; display: block; margin: 0 auto; }
        
        /* İsim Girişi */
        input[type="text"] { padding: 10px; font-size: 15px; border: 2px solid #ffcc80; border-radius: 15px; width: 90%; max-width: 340px; margin: 10px 0 5px 0; text-align: center; font-weight: bold; color: #ff5722; background: #fffdf9; }
        
        /* Genel Butonlar */
        .btn { background: #2196f3; color: white; border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 30px; cursor: pointer; text-decoration: none; display: inline-block; box-shadow: 0 4px 10px rgba(33,150,243,0.3); transition: 0.2s; margin: 6px 4px; width: 90%; max-width: 320px; text-align: center; }
        .btn:hover { transform: scale(1.02); }
        .btn.boyama1 { background: #4caf50; }
        .btn.boyama2 { background: #ff9800; }
        .btn.indir { background: #e91e63; }

        .library-group { display: flex; flex-direction: column; gap: 8px; align-items: center; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- ÜST BİLGİ -->
    <header>
        <h1>🎨 Minik Sanatçı Boyama Dünyası</h1>
        <p>Dijital Tuval ve Boyama Kitapları!</p>
    </header>

    <!-- DİJİTAL BOYAMA TUVALİ -->
    <div class="section">
        <h2>✨ Akıllı Boyama Tuvali</h2>
        
        <!-- Şablon Seçimi -->
        <div class="template-group">
            <button class="tpl-btn active" onclick="setTemplate('house', this)">🏠 Ev & Bahçe</button>
            <button class="tpl-btn" onclick="setTemplate('cat', this)">🐱 Sevimli Kedi</button>
            <button class="tpl-btn" onclick="setTemplate('rocket', this)">🚀 Uzay Roketi</button>
        </div>

        <!-- Renkler -->
        <div class="palette">
            <div class="color-box active" style="background: #ff5722;" onclick="selectColor('#ff5722', this)"></div>
            <div class="color-box" style="background: #4caf50;" onclick="selectColor('#4caf50', this)"></div>
            <div class="color-box" style="background: #2196f3;" onclick="selectColor('#2196f3', this)"></div>
            <div class="color-box" style="background: #ffeb3b;" onclick="selectColor('#ffeb3b', this)"></div>
            <div class="color-box" style="background: #9c27b0;" onclick="selectColor('#9c27b0', this)"></div>
            <div class="color-box" style="background: #e91e63;" onclick="selectColor('#e91e63', this)"></div>
        </div>

        <!-- Araçlar ve Kalem Kalınlıkları -->
        <div class="tools">
            <button class="tool-btn size-btn active-size" id="sizeThin" onclick="setLineWidth(3, this)">✏️ İnce Kalem</button>
            <button class="tool-btn size-btn" id="sizeNormal" onclick="setLineWidth(8, this)">🖊️ Normal</button>
            <button class="tool-btn size-btn" id="sizeThick" onclick="setLineWidth(15, this)">🖌️ Kalın</button>
        </div>
        <div class="tools">
            <button class="tool-btn bucket" id="bucketBtn" onclick="enableBucket()">🪣 Dolgu</button>
            <button class="tool-btn eraser" onclick="enableEraser(this)">🧽 Silgi</button>
            <button class="tool-btn clear" onclick="clearCanvas()">🗑️ Temizle</button>
        </div>

        <!-- Çocuğun İsmi (Resmin İçine İşlenir) -->
        <input type="text" id="childName" placeholder="Adını Yaz (Harflerini Boya!)" oninput="redrawEverything()">

        <!-- Tuval -->
        <canvas id="paintCanvas" width="360" height="280"></canvas>
        
        <button class="btn indir" onclick="downloadImage()">📸 Boyadığımı İndir & Kutla 🎉</button>
    </div>

    <!-- BOYAMA KİTAPLARI İNDİRME ALANI -->
    <div class="section">
        <h2>📚 Yazıcı İçin Boyama Kitapları</h2>
        <p>İstediğin boyama kitabını tek tıkla indir!</p>
        
        <div class="library-group">
            <a href="boyama-kitap-01.pdf" class="btn boyama1" target="_blank">🖍️ Boyama Kitabı 1 (PDF)</a>
            <a href="boyama-kitap-02.pdf" class="btn boyama2" target="_blank">🖍️ Boyama Kitabı 2 (PDF)</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;
        let currentColor = '#ff5722';
        let currentLineWidth = 3; 
        let currentTemplate = 'house';
        let isBucketMode = false;

        // Kullanıcının yaptığı boyamaları korumak için offscreen tuval katmanı
        let userCanvas = document.createElement('canvas');
        userCanvas.width = 360;
        userCanvas.height = 280;
        let userCtx = userCanvas.getContext('2d');

        function playPopSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        function resetUserCanvas() {
            userCtx.fillStyle = '#fff';
            userCtx.fillRect(0, 0, userCanvas.width, userCanvas.height);
        }
        resetUserCanvas();

        function drawTemplateLines() {
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#333';

            if (currentTemplate === 'house') {
                // Güneş
                ctx.beginPath(); ctx.arc(60, 50, 20, 0, Math.PI * 2); ctx.fillStyle = '#fff9c4'; ctx.fill(); ctx.stroke();
                // Bulut
                ctx.beginPath(); ctx.arc(280, 55, 12, 0, Math.PI * 2); ctx.arc(295, 55, 15, 0, Math.PI * 2); ctx.arc(310, 55, 12, 0, Math.PI * 2); ctx.stroke();
                // Ev Gövdesi
                ctx.strokeRect(130, 110, 100, 90);
                // Çatı
                ctx.beginPath(); ctx.moveTo(115, 110); ctx.lineTo(180, 55); ctx.lineTo(245, 110); ctx.closePath(); ctx.stroke();
                // Kapı
                ctx.strokeRect(165, 150, 30, 50);
                // Pencereler
                ctx.strokeRect(142, 125, 20, 20);
                ctx.strokeRect(198, 125, 20, 20);
            } else if (currentTemplate === 'cat') {
                ctx.beginPath(); ctx.arc(180, 130, 55, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
                // Kulaklar
                ctx.beginPath(); ctx.moveTo(140, 95); ctx.lineTo(135, 45); ctx.lineTo(170, 80); ctx.closePath(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(220, 95); ctx.lineTo(225, 45); ctx.lineTo(190, 80); ctx.closePath(); ctx.stroke();
                // Gözler ve Burun
                ctx.beginPath(); ctx.arc(160, 120, 6, 0, Math.PI * 2); ctx.fillStyle = '#333'; ctx.fill();
                ctx.beginPath(); ctx.arc(200, 120, 6, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(180, 135, 4, 0, Math.PI * 2); ctx.fill();
                // Bıyıklar
                ctx.beginPath(); ctx.moveTo(135, 140); ctx.lineTo(105, 135); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(135, 152); ctx.lineTo(105, 155); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(225, 140); ctx.lineTo(255, 135); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(225, 152); ctx.lineTo(255, 155); ctx.stroke();
            } else if (currentTemplate === 'rocket') {
                ctx.beginPath(); ctx.arc(180, 105, 32, Math.PI, 0, false); ctx.lineTo(212, 175); ctx.lineTo(148, 175); ctx.closePath(); ctx.stroke();
                // Kanatlar
                ctx.beginPath(); ctx.moveTo(148, 145); ctx.lineTo(122, 175); ctx.lineTo(148, 175); ctx.closePath(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(212, 145); ctx.lineTo(238, 175); ctx.lineTo(212, 175); ctx.closePath(); ctx.stroke();
                // Pencere
                ctx.beginPath(); ctx.arc(180, 100, 10, 0, Math.PI * 2); ctx.stroke();
                // Alevler
                ctx.beginPath(); ctx.moveTo(165, 175); ctx.lineTo(180, 205); ctx.lineTo(195, 175); ctx.closePath(); ctx.stroke();
            }

            // Çocuğun İsmi (Harf İçi Boyama İçin)
            const nameInput = document.getElementById('childName').value.trim().toUpperCase();
            const displayName = nameInput !== "" ? nameInput : "SANATÇI";
            
            ctx.font = "bold 22px Arial";
            ctx.textAlign = "center";
            ctx.lineWidth = 1;
            ctx.strokeStyle = "#333";
            ctx.strokeText(displayName, canvas.width / 2, 235);
        }

        function redrawEverything() {
            // Önce kullanıcının boyadığı/doldurduğu katmanı bas
            ctx.drawImage(userCanvas, 0, 0);
            // Üstüne siyah şablon çizgilerini ve ismi çiz
            drawTemplateLines();
        }

        function initCanvas() {
            resetUserCanvas();
            // Dış Çerçeve
            userCtx.lineWidth = 3;
            userCtx.strokeStyle = '#ccc';
            userCtx.strokeRect(10, 10, userCanvas.width - 20, userCanvas.height - 20);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            redrawEverything();
        }
        initCanvas();

        function setTemplate(tpl, btn) {
            currentTemplate = tpl;
            isBucketMode = false;
            document.getElementById('bucketBtn').classList.remove('active-bucket');
            document.querySelectorAll('.tpl-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            initCanvas();
            playPopSound();
        }

        function setLineWidth(width, btn) {
            currentLineWidth = width;
            isBucketMode = false;
            document.getElementById('bucketBtn').classList.remove('active-bucket');
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active-size'));
            if(btn) btn.classList.add('active-size');
            playPopSound();
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX, clientY = e.clientY;
            if (e.touches && e.touches[0]) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        // Akıllı Flood Fill (Kova Dolgu) Fonksiyonu
        function floodFill(startX, startY, fillColorHex) {
            // Tam renk uyumu için şablon çizgilerini de ekrana çizip piksel haritasını alalım
            redrawEverything();
            
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imgData.data;

            const startPos = (Math.floor(startY) * canvas.width + Math.floor(startX)) * 4;
            const startR = pixels[startPos];
            const startG = pixels[startPos + 1];
            const startB = pixels[startPos + 2];

            // Çizgiye (siyah) veya aynı renge tıklandıysa dolgu yapma
            if (startR < 50 && startG < 50 && startB < 50) return;

            // Hex rengini RGB'ye çevir
            let tempC = document.createElement('canvas').getContext('2d');
            tempC.fillStyle = fillColorHex;
            tempC.fillRect(0,0,1,1);
            let cData = tempC.getImageData(0,0,1,1).data;
            const targetR = cData[0], targetG = cData[1], targetB = cData[2];

            if (startR === targetR && startG === targetG && startB === targetB) return;

            // UserCanvas üzerinde boyama yapacağız ki şablonlar kaybolmasın
            const userImgData = userCtx.getImageData(0, 0, userCanvas.width, userCanvas.height);
            const userPixels = userImgData.data;

            let queue = [[Math.floor(startX), Math.floor(startY)]];
            let visited = new Uint8Array(canvas.width * canvas.height);

            while (queue.length > 0) {
                let [x, y] = queue.pop();
                let idx = (y * canvas.width + x);

                if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) continue;
                if (visited[idx]) continue;
                visited[idx] = 1;

                let pIdx = idx * 4;
                let r = pixels[pIdx], g = pixels[pIdx+1], b = pixels[pIdx+2];

                // Sınırları (siyah çizgileri) kontrol et
                if (r < 60 && g < 60 && b < 60) continue;

                // Benzer renkleri doldurmak için tolerans
                if (Math.abs(r - startR) + Math.abs(g - startG) + Math.abs(b - startB) < 60) {
                    userPixels[pIdx] = targetR;
                    userPixels[pIdx+1] = targetG;
                    userPixels[pIdx+2] = targetB;
                    userPixels[pIdx+3] = 255;

                    // Ana pikselleri de güncelle ki döngü ilerlesin
                    pixels[pIdx] = targetR;
                    pixels[pIdx+1] = targetG;
                    pixels[pIdx+2] = targetB;

                    queue.push([x + 1, y]);
                    queue.push([x - 1, y]);
                    queue.push([x, y + 1], [x, y - 1]);
                }
            }

            userCtx.putImageData(userImgData, 0, 0);
            redrawEverything();
        }

        function startAction(e) {
            const pos = getMousePos(e);
            
            if (isBucketMode) {
                floodFill(pos.x, pos.y, currentColor);
                playPopSound();
                return;
            }

            painting = true;
            userCtx.beginPath();
            userCtx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function endPosition() {
            if (!painting) return;
            painting = false;
            userCtx.beginPath();
        }

        function draw(e) {
            if (!painting || isBucketMode) return;
            e.preventDefault();
            const pos = getMousePos(e);

            userCtx.lineWidth = currentLineWidth;
            userCtx.lineCap = 'round';
            userCtx.lineJoin = 'round';
            userCtx.strokeStyle = currentColor;

            userCtx.lineTo(pos.x, pos.y);
            userCtx.stroke();
            userCtx.beginPath();
            userCtx.moveTo(pos.x, pos.y);

            redrawEverything();
        }

        canvas.addEventListener('mousedown', startAction);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', startAction, { passive: false });
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw, { passive: false });

        function selectColor(color, element) {
            currentColor = color;
            isBucketMode = false;
            document.getElementById('bucketBtn').classList.remove('active-bucket');
            document.querySelectorAll('.color-box').forEach(b => b.classList.remove('active'));
            if(element) element.classList.add('active');
            playPopSound();
        }

        function enableEraser(element) {
            currentColor = '#ffffff';
            currentLineWidth = 18;
            isBucketMode = false;
            document.getElementById('bucketBtn').classList.remove('active-bucket');
            document.querySelectorAll('.color-box').forEach(b => b.classList.remove('active'));
            playPopSound();
        }

        function enableBucket() {
            isBucketMode = true;
            document.getElementById('bucketBtn').classList.add('active-bucket');
            playPopSound();
        }

        function clearCanvas() {
            isBucketMode = false;
            document.getElementById('bucketBtn').classList.remove('active-bucket');
            initCanvas();
            playPopSound();
        }

        function downloadImage() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });

            redrawEverything();
            const link = document.createElement('a');
            link.download = 'minik-sanatci-boyama.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
