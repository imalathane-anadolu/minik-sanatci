<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minik Sanatçı - Çocuk Boyama ve Aktivite Dünyası</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #fdfbf7; color: #333; text-align: center; padding: 15px; }
        
        /* Başlık Alanı */
        header { background: #ffdf6d; padding: 20px; border-radius: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #ff5722; font-size: 24px; margin-bottom: 8px; }
        p { color: #555; font-size: 14px; margin-bottom: 12px; }

        /* Ortak Buton Stilleri */
        .btn { background: #ff5722; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer; text-decoration: none; display: inline-block; box-shadow: 0 4px 10px rgba(255,87,34,0.3); transition: 0.2s; margin: 8px 4px; }
        .btn:hover { background: #f4511e; transform: scale(1.03); }

        /* Bölüm Kutuları */
        .section { background: white; padding: 20px 15px; border-radius: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .section h2 { color: #333; font-size: 20px; margin-bottom: 10px; }

        /* Tuval Alanı */
        input[type="text"] { padding: 10px; font-size: 15px; border: 2px solid #ddd; border-radius: 10px; width: 85%; max-width: 280px; margin-bottom: 12px; text-align: center; }
        .palette { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .color-box { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .color-box.active { border: 3px solid #333; transform: scale(1.1); }
        canvas { background: #fff; border: 3px dashed #ffdf6d; border-radius: 15px; max-width: 100%; touch-action: none; cursor: crosshair; }
        .tools { margin: 10px 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .tool-btn { background: #ff9800; color: white; border: none; padding: 8px 16px; font-size: 14px; font-weight: bold; border-radius: 20px; cursor: pointer; }
        .tool-btn.eraser { background: #9e9e9e; }
        .tool-btn.clear { background: #f44336; }
        .name-output { font-size: 22px; font-weight: bold; letter-spacing: 2px; color: #444; margin-top: 8px; text-transform: uppercase; -webkit-text-stroke: 1px #ff5722; }

        /* Kütüphane Butonları Alanı */
        .library-group { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 10px; }
        .lib-btn { background: #4caf50; width: 100%; max-width: 300px; text-align: center; }
    </style>
</head>
<body>

    <!-- ÜST BİLGİ -->
    <header>
        <h1>🎨 Minik Sanatçı Boyama Dünyası</h1>
        <p>Dijital Tuvalde Boya & Sınırsız Boyama Kitabını İndir!</p>
    </header>

    <!-- DİJİTAL BOYAMA TUVALİ -->
    <div class="section">
        <h2>✨ Parmakla Boyama Tuvali</h2>
        <p>Sanatçının adını yaz, rengini seç ve dilediğin gibi boya!</p>
        
        <input type="text" id="childName" placeholder="Sanatçının Adı (Örn: ZEYNEP)" oninput="updateName()">
        
        <div class="palette">
            <div class="color-box active" style="background: #ff5722;" onclick="selectColor('#ff5722', this)"></div>
            <div class="color-box" style="background: #4caf50;" onclick="selectColor('#4caf50', this)"></div>
            <div class="color-box" style="background: #2196f3;" onclick="selectColor('#2196f3', this)"></div>
            <div class="color-box" style="background: #ffeb3b;" onclick="selectColor('#ffeb3b', this)"></div>
            <div class="color-box" style="background: #9c27b0;" onclick="selectColor('#9c27b0', this)"></div>
            <div class="color-box" style="background: #e91e63;" onclick="selectColor('#e91e63', this)"></div>
        </div>

        <div class="tools">
            <button class="tool-btn eraser" onclick="enableEraser(this)">🧽 Silgi</button>
            <button class="tool-btn clear" onclick="clearCanvas()">🗑️ Temizle</button>
        </div>

        <canvas id="paintCanvas" width="320" height="220"></canvas>
        <div id="displayName" class="name-output">SANATÇI</div>
        
        <br>
        <button class="btn" onclick="downloadImage()" style="background: #2196f3; font-size: 15px; padding: 10px 20px; margin-top: 10px;">📸 Boyadığımı İndir</button>
    </div>

    <!-- BOYAMA KİTABI İNDİRME ALANI -->
    <div class="section">
        <h2>🖍️ Yazıcı İçin Boyama Kitabı</h2>
        <p>Tek tıklamayla boyama kitabını cihazına indir!</p>
        
        <div class="library-group">
            <!-- Repoya yükleyeceğimiz boyama kitabının adı -->
            <a href="boyama-kitap-01.pdf" class="btn lib-btn" target="_blank">🖍️ Boyama Kitabını İndir (PDF)</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;
        let currentColor = '#ff5722';
        let currentLineWidth = 12;

        function initCanvas() {
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#333';
            ctx.strokeRect(15, 15, 290, 190);
            ctx.font = "15px Arial";
            ctx.fillStyle = "#888";
            ctx.fillText("Parmağınla burayı boya 🖌️", 75, 115);
        }
        initCanvas();

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches[0]) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startPosition(e) {
            painting = true;
            const pos = getMousePos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function endPosition() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting) return;
            e.preventDefault();
            
            const pos = getMousePos(e);

            ctx.lineWidth = currentLineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = currentColor;

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', startPosition, { passive: false });
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw, { passive: false });

        function selectColor(color, element) {
            currentColor = color;
            currentLineWidth = 12;
            document.querySelectorAll('.color-box').forEach(b => b.classList.remove('active'));
            if(element) element.classList.add('active');
        }

        function enableEraser(element) {
            currentColor = '#ffffff';
            currentLineWidth = 22;
            document.querySelectorAll('.color-box').forEach(b => b.classList.remove('active'));
        }

        function clearCanvas() {
            initCanvas();
        }

        function updateName() {
            const nameVal = document.getElementById('childName').value;
            document.getElementById('displayName').innerText = nameVal ? nameVal : 'SANATÇI';
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'minik-sanatci-boyama.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
